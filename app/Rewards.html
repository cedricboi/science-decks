<style>

  --rw-yellow: #FFD23F; --rw-yellow-d: #C9A200; --rw-purple: #6D35A8; --rw-purple-d: #4B2378; --rw-red: #B42318;
  --rw-common: #7B8594; --rw-rare: #2F6FE4; --rw-epic: #8E4EC6; --rw-legendary: #E08A00;
  --rw-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif; --rw-text: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  position: fixed; inset: 0; z-index: 70; font-family: var(--rw-text); color: var(--rw-ink); overflow: hidden; -webkit-user-select: none; user-select: none;
  background: linear-gradient(180deg, #7FB2FF 0%, #BFD9FF 55%, #E9F2FF 100%); }

/* chunky game buttons */

  font-family: var(--rw-display); font-weight: 800; font-size: 17px; letter-spacing: .01em; color: #fff; background: var(--rw-blue); box-shadow: 0 4px 0 var(--rw-blue-d); transition: transform .06s; }

/* studio layout */

#rw .panel-head { padding: 14px 16px 0; padding-top: max(14px, env(safe-area-inset-top)); flex: none; }

#rw .panel-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 16px; }

#rw .card { position: relative; border: 2px solid var(--rw-line); border-radius: 16px; background: #F7F9FC; padding: 6px 6px 8px; text-align: left; overflow: hidden; }
#rw .card.sel { border-color: var(--rw-blue); box-shadow: 0 0 0 3px rgba(47,111,228,.25); background: #fff; }
#rw .card .tier-bar { position: absolute; left: 0; right: 0; top: 0; height: 5px; }

#rw .card .pr { display: flex; align-items: center; gap: 4px; font-family: var(--rw-display); font-weight: 800; font-size: 15px; margin: 0 2px; }
#rw .card .pr svg { width: 18px; height: 18px; }
#rw .card .pr.own { color: var(--rw-green); font-family: var(--rw-text); font-size: 13px; }

#rw .card .tier { position: absolute; right: 8px; top: 10px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #fff; padding: 2px 6px; border-radius: 6px; }
#rw .t-common { background: var(--rw-common); } #rw .t-rare { background: var(--rw-rare); } #rw .t-epic { background: var(--rw-epic); } #rw .t-legendary { background: linear-gradient(90deg, #F5A524, #E0508A); } #rw .t-free { background: #A7B0BE; }
#rw .actbar { flex: none; border-top: 1px solid var(--rw-line); padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; min-height: 74px; }
#rw .actbar .what { flex: 1; min-width: 0; }
#rw .actbar .what b { display: block; font-family: var(--rw-display); font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rw .actbar .what span { font-size: 13px; color: var(--rw-muted); }

#rw .sw-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 18px; }
#rw .sw { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--rw-line); padding: 0; }

/* points page */

#rw .bank b svg { width: 34px; height: 34px; }

#rw table.rules { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 15px; }
#rw table.rules td { padding: 9px 4px; border-bottom: 1px solid var(--rw-line); }

/* market HUD */

#rw-touch { position: absolute; inset: 0; z-index: 1; touch-action: none; }
#rw .joy.float { opacity: .9; }
#rw .joy { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); touch-action: none; z-index: 6; }
#rw .joy i { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
#rw .mk-side { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(26px, env(safe-area-inset-bottom)) + 96px); display: flex; flex-direction: column; gap: 12px; align-items: flex-end; z-index: 6; }
#rw .stallcard { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(430px, calc(100vw - 360px)); min-width: 280px; background: #fff; border-radius: 20px; padding: 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 16px 40px rgba(0,0,0,.45); z-index: 7; animation: rwUp .18s ease-out; }
#rw .stallcard img { width: 86px; height: 86px; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #fff, #E4ECF8); flex: none; }
#rw .stallcard .info { flex: 1; min-width: 0; }
#rw .stallcard .info b { display: block; font-family: var(--rw-display); font-weight: 800; font-size: 20px; line-height: 1.15; }
#rw .stallcard .info span { display: block; font-size: 14px; color: var(--rw-muted); margin: 2px 0 10px; }
#rw .stallcard .rb { width: 100%; }
@keyframes rwUp { from { transform: translate(-50%, 16px); } to { transform: translate(-50%, 0); } }
/* stickers */
#rw .say { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 82px; height: 82px; border-radius: 50%; border: 4px solid #fff; padding: 0; z-index: 7;
  background: radial-gradient(circle at 40% 35%, #FFF3A0, #FFC21A); box-shadow: 0 5px 0 #C98A00, 0 10px 24px rgba(0,0,0,.35); }
#rw .say img { width: 70px; height: 70px; display: block; margin: auto; }
#rw .say .cd { position: absolute; inset: -4px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-family: var(--rw-display); font-weight: 800; font-size: 30px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4);
  background: conic-gradient(rgba(12,14,38,.66) var(--p, 0%), rgba(12,14,38,.12) 0); }
#rw .say.cooling .cd { display: flex; }
#rw .say:active { transform: translateY(3px); box-shadow: 0 2px 0 #C98A00; }
#rw-mkt.traying .mk-side { visibility: hidden; }
#rw .tray { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(22px, env(safe-area-inset-bottom)) + 96px); width: min(372px, calc(100vw - 28px)); max-height: calc(100% - 190px); overflow-y: auto;
  background: #fff; border-radius: 22px; padding: 14px; z-index: 9; box-shadow: 0 16px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 10px; animation: rwPop .15s ease-out; }
#rw .tray-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
#rw .tray-head b { font-family: var(--rw-display); font-weight: 800; font-size: 20px; }
#rw .tray-head span { font-size: 13px; color: var(--rw-muted); }
#rw .tray p { margin: 0; font-size: 15px; line-height: 1.4; color: #3A4252; }
#rw .tray-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
#rw .tray-grid button { aspect-ratio: 1; border: 2px solid var(--rw-line); border-radius: 16px; background: #F4F0FF; padding: 4px; }

#rw .tray-grid img { width: 100%; height: 100%; display: block; }
#rw .st-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
#rw .st-grid .st { border: 2px solid var(--rw-line); border-radius: 14px; background: #F7F9FC; padding: 4px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
#rw .st-grid .st img { width: 100%; max-width: 72px; aspect-ratio: 1; }

#rw .st-grid .st.own { background: #E6F4EC; border-color: #9AD6B3; }
#rw .st-grid .st.own span { color: var(--rw-green); font-family: var(--rw-text); font-size: 12px; }
#rw .st-grid .st.poor { opacity: .55; }
#rw .toast { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); background: rgba(12,14,38,.8); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 15px; text-align: center; max-width: calc(100vw - 32px); z-index: 8; transition: opacity .4s; pointer-events: none; }

/* boxes */
#rw .veil { position: absolute; inset: 0; background: rgba(12,14,38,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
#rw .box { background: #fff; border-radius: 22px; padding: 22px; width: 100%; max-width: 420px; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center; animation: rwPop .18s ease-out; }

#rw .code { display: inline-block; font-family: var(--rw-display); font-weight: 800; font-size: 36px; letter-spacing: .14em; background: #FFF7D6; border: 3px dashed #E0A800; border-radius: 14px; padding: 6px 18px; margin: 6px 0 10px; }
#rw .tickets { list-style: none; padding: 0; margin: 8px 0 0; text-align: left; }
#rw .tickets li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rw-line); }
#rw .tickets li b { flex: 1; font-size: 16px; }
#rw .tickets li .c { font-family: var(--rw-display); font-weight: 800; letter-spacing: .1em; }
#rw .tickets li .s { font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: #FFF4D6; color: #8A5A00; }
#rw .tickets li .s.done { background: #E6F4EC; color: var(--rw-green); }
@keyframes rwPop { from { transform: scale(.96); } to { transform: scale(1); } }
#rw .spin { width: 40px; height: 40px; border: 5px solid #E3E8F0; border-top-color: var(--rw-blue); border-radius: 50%; animation: rwSpin 1s linear infinite; margin: 8px auto 14px; }
@keyframes rwSpin { to { transform: rotate(360deg); } }
#rw .loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; background: linear-gradient(180deg, #7FB2FF, #E9F2FF); font-family: var(--rw-display); font-weight: 800; font-size: 20px; color: #1B2433; }
#rw .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 25; overflow: hidden; }
#rw .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: rwFall 1.8s ease-in forwards; }
@keyframes rwFall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { #rw .confetti { display: none; } #rw .stallcard, #rw .box { animation: none; } }

/* narrow screens: avatar on top, panel below */
@media (max-width: 760px), (orientation: portrait) and (max-width: 900px) {
  #rw .stage { right: 0; bottom: 52%; }
  #rw .panel { top: 48%; width: 100%; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(21,42,110,.18); }
  #rw .panel-head { padding-top: 12px; }
  #rw .stage-foot { bottom: 0; padding: 0 14px 12px; }
  #rw .stage-hint { display: none; }
  #rw .stallcard { width: calc(100vw - 28px); bottom: calc(max(26px, env(safe-area-inset-bottom)) + 140px); }
  #rw .mk-side { top: calc(max(12px, env(safe-area-inset-top)) + 58px); bottom: auto; }
  #rw .joy { width: 124px; height: 124px; }
  #rw .say { width: 72px; height: 72px; } #rw .say img { width: 60px; height: 60px; }
  #rw .rw-top h1 { font-size: 20px; }
}
</style>

<script>

var ART = (function () {

  var HAIR_COLOURS = ['#1E1916', '#3B2417', '#6B3F22', '#A8672F', '#E3B75A', '#C4552B', '#B9B9C2', '#3D6FE0', '#F06BB0', '#8A4DE0', '#2FB36B'];

  var PANTS_COLOURS = ['#2B2F3A', '#3E5F8A', '#6B5B4A', '#C8B48A', '#5F6B7A', '#1F3A93', '#7A2E3B', '#F2F2F2'];
  var DEFAULT = { skin: '#F1C49B', hair: 'hair_short', hairColor: '#1E1916', face: 'face_smile', top: 'top_tee', topColor: '#2F6FE4',
    bottom: 'bot_pants', bottomColor: '#2B2F3A', shoes: 'shoe_white', hat: '', eyes: '', back: '', hand: '', pet: '' };

  var HEAD = { r: 0.7, side: 0.9, rc: 0.22, y: 4.72 };

  /* ---------- pictures for the shop cards ---------- */
  var TH = null;
  function thumbKit() {
    if (TH) return TH;
    var r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1); r.setSize(240, 240); r.outputEncoding = THREE.sRGBEncoding;
    var sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight('#FFFFFF', '#9A8F86', 0.7));
    var d = new THREE.DirectionalLight('#FFFFFF', 0.75); d.position.set(3, 8, 8); sc.add(d);
    TH = { r: r, sc: sc, cam: new THREE.PerspectiveCamera(28, 1, 0.1, 200) };
    return TH;
  }
  function snap(obj, yaw, pitch) {
    var K = thumbKit(), holder = new THREE.Group();
    holder.add(obj); holder.rotation.y = yaw; K.sc.add(holder);
    holder.updateMatrixWorld(true);
    var box = new THREE.Box3().setFromObject(holder), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    var rad = Math.max(s.x, s.y, s.z) * 0.62 + 0.05;
    var dist = rad / Math.tan(K.cam.fov / 2 * Math.PI / 180);
    var p = pitch == null ? 0.22 : pitch;
    K.cam.position.set(c.x, c.y + Math.sin(p) * dist, c.z + Math.cos(p) * dist); K.cam.lookAt(c);
    K.r.render(K.sc, K.cam);
    var url = K.r.domElement.toDataURL('image/png');
    K.sc.remove(holder); ART.disposeTree(holder);
    return url;
  }
  function thumbKey(slot, id) { var o = R.look || ART.DEFAULT; return slot + '|' + id + '|' + o.skin + '|' + o.hairColor + '|' + (slot === 'top' || slot === 'bottom' ? o.bottomColor + o.topColor : ''); }
  function thumbImg(slot, id, extra) {
    var k = slot === 'prize' ? 'prize|' + id : thumbKey(slot, id);
    var src = R.thumbs[k];
    if (!src) { if (R.q.indexOf(k) < 0) R.q.push(k); pump(); }
    return '<img class="thumb' + (extra ? ' ' + extra : '') + '" alt="" data-k="' + esc(k) + '"' + (src ? ' src="' + src + '"' : '') + '>';
  }
  var pumping = false;
  function pump() {
    if (pumping) return; pumping = true;
    requestAnimationFrame(function step() {
      var n = 0;
      while (R.q.length && n < 3) {
        var k = R.q.shift(), bits = k.split('|'), slot = bits[0], id = bits[1];
        if (R.thumbs[k]) continue;
        try {
          if (slot === 'prize') R.thumbs[k] = snap(PRIZE_ART.build(id), 0.5, 0.2);
          else {
            var obj = ART.preview(slot, id, R.look);
            var yaw = slot === 'back' ? Math.PI + 0.55 : slot === 'pet' ? 0.6 : slot === 'hand' ? 0.9 : 0.45;
            R.thumbs[k] = snap(obj, yaw, slot === 'shoes' ? 0.5 : 0.2);
          }
        } catch (e) { R.thumbs[k] = 'data:image/gif;base64,R0lGODlhAQABAAAAACw='; }
        Array.prototype.forEach.call(document.querySelectorAll('#rw img[data-k="' + k.replace(/"/g, '\\"') + '"]'), function (im) { im.src = R.thumbs[k]; });
        n++;
      }
      if (R.q.length) requestAnimationFrame(step); else pumping = false;
    });
  }

    var p = prizeById(st.prize.id) || st.prize, t = R.st.tokens, btn;
    if (p.left === 0) btn = '<button class="rb" disabled>Sold out</button>';
    else if (!R.mk.open) btn = '<button class="rb" disabled>' + esc(R.mk.note || 'Opens at the end of term') + '</button>';
    else if (t < p.tokens) btn = '<button class="rb" disabled>You need ' + toks(p.tokens - t) + ' more</button>';
    else btn = '<button class="rb green" id="rw-sc">' + ICON.token + 'Get it for ' + p.tokens + '</button>';
    c.innerHTML = '<div class="stallcard">' + thumbImg('prize', p.art) + '<div class="info"><b>' + (st.grand ? '★ ' : '') + esc(p.name) + '</b><span>' + toks(p.tokens) + (p.left != null ? ' · ' + (p.left > 0 ? p.left + ' left' : 'none left') : '') + '</span>' + btn + '</div></div>';
    if ($('rw-sc')) $('rw-sc').onclick = function () { order(p, st); };
  }
  function order(p, st) {
    box('<div>' + thumbImg('prize', p.art, 'big') + '</div><h2>Get ' + esc(p.name) + '?</h2><p>It costs ' + toks(p.tokens) + '. You will have ' + toks(R.st.tokens - p.tokens) + ' left.</p>',
      [{ text: 'Not now', cls: 'white' }, { text: 'Get it', cls: 'green', keep: true, fn: function () {
        busyBox('Getting your ticket');
        api('api_rw_order', p.id).then(function (res) {
          setState(res.state);
          if (res.market) { R.mk.prizes = res.market.prizes; R.mk.orders = res.market.orders; }
          renderPills(); stallCard(st); confetti();
          box('<h2>You got ' + esc(p.name) + '!</h2><p>Show this ticket to your teacher to collect it.</p><div class="code">' + esc(res.order.code) + '</div><p class="note">You can find it again in My tickets.</p>', [{ text: 'Great', cls: 'green' }]);
        }).catch(function (e) { box('<h2>Could not get it</h2><p>' + esc(clean(e)) + '</p>', [{ text: 'OK', cls: 'blue' }]); });
      } }]);
  }
  function ticketsBox() {
    var l = (R.mk && R.mk.orders) || [];
    box('<h2>My tickets</h2>' + (l.length ? '<p>Show the code to your teacher to collect your prize.</p><ul class="tickets">' + l.map(function (o) {
      return '<li><b>' + esc(o.prize) + '<br><span class="note">' + esc(o.when) + '</span></b><span class="c">' + esc(o.code) + '</span><span class="s' + (o.done ? ' done' : '') + '">' + (o.done ? 'Collected' : 'To collect') + '</span></li>';
    }).join('') + '</ul>' : '<p>You have not got any prizes yet.</p>'), [{ text: 'Close', cls: 'blue' }]);
  }
  /* ---------- moving and looking ---------- */
  // The stick moves the avatar. Pressing anywhere on the left of the screen puts the stick under the thumb.
  var STICK = null;
  function joystick(el) {
    var knob = el.querySelector('i'), R0 = 52, s = { id: null, cx: 0, cy: 0, t0: 0, moved: false };
    function set(x, y) { knob.style.transform = 'translate(' + x + 'px,' + y + 'px)'; if (R.market) R.market.setJoystick(x / R0, y / R0); }
    s.begin = function (e, float) {
      s.id = e.pointerId; s.t0 = performance.now(); s.moved = false; s.float = float; s.sx = e.clientX; s.sy = e.clientY;
      if (float) { var host = $('rw-mkt').getBoundingClientRect(); el.style.left = (e.clientX - host.left - el.offsetWidth / 2) + 'px'; el.style.top = (e.clientY - host.top - el.offsetHeight / 2) + 'px'; el.style.bottom = 'auto'; el.classList.add('float'); }
      var r = el.getBoundingClientRect(); s.cx = r.left + r.width / 2; s.cy = r.top + r.height / 2;
      s.move(e);
    };
    s.move = function (e) {
      if (e.pointerId !== s.id) return;
      var dx = e.clientX - s.cx, dy = e.clientY - s.cy, d = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(e.clientX - s.sx) + Math.abs(e.clientY - s.sy) > 7) s.moved = true;
      if (d > R0) { dx = dx / d * R0; dy = dy / d * R0; }
      set(dx, dy);
    };
    s.end = function (e) {
      if (e && e.pointerId !== s.id) return false;
      var wasTap = !!(e && s.float && !s.moved && performance.now() - s.t0 < 400);
      s.id = null; set(0, 0); el.style.left = el.style.top = el.style.bottom = ''; el.classList.remove('float');
      return wasTap;
    };
    el.addEventListener('pointerdown', function (e) { try { el.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } closeTray(); s.begin(e, false); e.preventDefault(); });
    el.addEventListener('pointermove', s.move);
    el.addEventListener('pointerup', s.end); el.addEventListener('pointercancel', s.end);
    return s;
  }
  // The layer over the market: the left of the screen is for walking, the right is for looking round.
  function touchLayer(el) {
    var looks = {};
    el.addEventListener('pointerdown', function (e) {
      if (!R.market) return;
      try { el.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
      closeTray();
      if (e.clientX < el.clientWidth * 0.4 && STICK.id === null) { STICK.begin(e, true); e.preventDefault(); return; }
      looks[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (STICK.id === e.pointerId) { STICK.move(e); return; }
      var l = looks[e.pointerId]; if (!l || !R.market) return;
      if (!l.moved && Math.abs(e.clientX - l.sx) + Math.abs(e.clientY - l.sy) > 7) l.moved = true;
      if (l.moved) R.market.look(e.clientX - l.x, e.clientY - l.y);
      l.x = e.clientX; l.y = e.clientY;
    });
    function up(e) {
      if (STICK.id === e.pointerId) { if (STICK.end(e) && e.type === 'pointerup' && R.market) R.market.tap(e.clientX, e.clientY); return; }
      var l = looks[e.pointerId]; delete looks[e.pointerId];
      if (l && !l.moved && e.type === 'pointerup' && performance.now() - l.t < 500 && R.market) R.market.tap(e.clientX, e.clientY);
    }
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', function (e) { if (R.market) { R.market.zoom(e.deltaY); e.preventDefault(); } }, { passive: false });
  }

  /* ---------- stickers ---------- */
  function stickerName(id) { var l = R.st.stickerShop; for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i].name; return ''; }
  function openTray() {
    var mine = R.st.stickerShop.filter(function (x) { return R.st.stickers.indexOf(x.id) >= 0; });
    var t = $('rw-tray');
    t.innerHTML = '<div class="tray-head"><b>My stickers</b><span>One every 8 seconds</span></div>' + (mine.length
      ? '<div class="tray-grid">' + mine.map(function (x) { return '<button data-id="' + x.id + '" aria-label="' + esc(x.name) + '"><img alt="" src="' + STICKERS.thumb(x.id) + '"></button>'; }).join('') + '</div>'
      : '<p>You have no stickers yet. Buy them with tokens at the Sticker Booth.</p>') +
      '<button class="rb purple small" id="rw-tray-shop">' + (mine.length ? 'Get more stickers' : 'Go to the Sticker Booth') + '</button>';
    t.classList.remove('hidden'); $('rw-mkt').classList.add('traying');
    Array.prototype.forEach.call(t.querySelectorAll('.tray-grid button'), function (b) { b.onclick = function () { sendSticker(b.getAttribute('data-id')); }; });
    $('rw-tray-shop').onclick = function () { closeTray(); if (R.market) R.market.goToKind('stickers'); };
  }
  function closeTray() { var t = $('rw-tray'); if (t) { t.classList.add('hidden'); t.innerHTML = ''; } var m = $('rw-mkt'); if (m) m.classList.remove('traying'); }
  function sendSticker(id) {
    if (!R.market) return;
    var cd = R.market.cooldown();
    if (cd > 0) { toast('Your next sticker is ready in ' + plural(Math.ceil(cd), 'second', 'seconds') + '.'); return; }
    if (R.market.say(id)) { closeTray(); cooldownTick(); }
  }
  var cdTimer = 0;
  function cooldownTick() {
    clearTimeout(cdTimer);
    var b = $('rw-say'); if (!b) return;
    var cd = R.market ? R.market.cooldown() : 0, span = b.querySelector('.cd');
    b.classList.toggle('cooling', cd > 0);
    if (span) { span.style.setProperty('--p', (cd / 8 * 100) + '%'); span.textContent = cd > 0 ? String(Math.ceil(cd)) : ''; }
    b.setAttribute('aria-label', cd > 0 ? 'Next sticker in ' + Math.ceil(cd) + ' seconds' : 'Show a sticker');
    if (cd > 0) cdTimer = setTimeout(cooldownTick, 100);
  }
  function stickerShop() {
    var l = R.st.stickerShop, t = R.st.tokens;
    box('<h2>Sticker Booth</h2><p>You have ' + toks(t) + '. A sticker is yours to keep. You can show one every 8 seconds.</p><div class="st-grid">' + l.map(function (x) {
      var own = R.st.stickers.indexOf(x.id) >= 0;
      return '<button class="st' + (own ? ' own' : t < x.tokens ? ' poor' : '') + '" data-id="' + x.id + '"><img alt="" src="' + STICKERS.thumb(x.id) + '"><b>' + esc(x.name) + '</b><span>' + (own ? 'Yours' : ICON.token + x.tokens) + '</span></button>';
    }).join('') + '</div>', [{ text: 'Done', cls: 'blue' }]);
    Array.prototype.forEach.call($('rw-box').querySelectorAll('.st'), function (b) { b.onclick = function () { buySticker(b.getAttribute('data-id')); }; });
  }
  function buySticker(id) {
    var x = R.st.stickerShop.filter(function (s) { return s.id === id; })[0]; if (!x) return;
    var t = R.st.tokens;
    if (R.st.stickers.indexOf(id) >= 0) { toast('You already have this sticker. Tap the sticker button to show it.'); return; }
    if (t < x.tokens) { box('<div><img class="big" alt="" src="' + STICKERS.thumb(id) + '"></div><h2>' + esc(x.name) + '</h2><p>This sticker costs ' + toks(x.tokens) + '. You need ' + toks(x.tokens - t) + ' more. Change points into tokens at the Token Exchange.</p>', [{ text: 'Back', cls: 'white', fn: stickerShop }]); return; }
    box('<div><img class="big" alt="" src="' + STICKERS.thumb(id) + '"></div><h2>Buy the "' + esc(x.name) + '" sticker?</h2><p>It costs ' + toks(x.tokens) + '. You will have ' + toks(t - x.tokens) + ' left.</p>',
      [{ text: 'Not now', cls: 'white', fn: stickerShop }, { text: 'Buy it', cls: 'green', keep: true, fn: function () {
        busyBox('Buying your sticker');
        api('api_rw_sticker', id).then(function (st) {
          setState(st); renderPills(); confetti();
          toast('The "' + x.name + '" sticker is yours. Tap the sticker button to show it.', 3600);
          stickerShop();
        }).catch(function (e) { box('<h2>Could not buy it</h2><p>' + esc(clean(e)) + '</p>', [{ text: 'OK', cls: 'blue', fn: stickerShop }]); });
      } }]);
  }

  /* ---------- boxes, toasts, confetti ---------- */
  function box(html, buttons) {
    $('rw-box').innerHTML = html + (buttons && buttons.length ? '<div class="row">' + buttons.map(function (b, i) { return '<button class="rb ' + (b.cls || '') + '" data-i="' + i + '">' + esc(b.text) + '</button>'; }).join('') + '</div>' : '');
    $('rw-veil').classList.remove('hidden');
    Array.prototype.forEach.call($('rw-box').querySelectorAll('.row .rb'), function (el) {
      el.onclick = function () { var b = buttons[+el.getAttribute('data-i')]; if (!b.keep) closeBox(); if (b.fn) b.fn(); };
    });
    var f = $('rw-box').querySelector('.row .rb:last-child'); if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  function busyBox(text) { $('rw-box').innerHTML = '<div class="spin"></div><p>' + esc(text) + '</p>'; $('rw-veil').classList.remove('hidden'); }
  function closeBox() { $('rw-veil').classList.add('hidden'); $('rw-box').innerHTML = ''; }
  var toastT = 0;
  function toast(text, ms) { var t = $('rw-toast'); if (!t) return; t.textContent = text; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(function () { t.style.opacity = 0; }, ms || 2600); }
  function confetti() {
    var c = $('rw-confetti'), cols = ['#FFD23F', '#E5484D', '#2F6FE4', '#1FA463', '#8E4EC6', '#F472B6'], h = '';
    for (var i = 0; i < 46; i++) h += '<i style="left:' + (Math.random() * 100) + '%;background:' + cols[i % cols.length] + ';animation-delay:' + (Math.random() * 0.4) + 's;animation-duration:' + (1.4 + Math.random()) + 's;transform:rotate(' + (Math.random() * 180) + 'deg)"></i>';
    c.innerHTML = h; setTimeout(function () { c.innerHTML = ''; }, 2800);
  }

  // A picture of the avatar's head, for the top of the homework page. Resolves to a PNG data URL, or null without 3D.
  function headshot(outfit) {
    if (!webglOk()) return Promise.resolve(null);
    return loadThree().then(function () {
      var A = ART.buildAvatar(ART.normalise(outfit || {}), { noPet: true, noShadow: true }), head = A.parts.head;
      head.parent.remove(head);
      var url = snap(head, 0.35, 0.08);
      ART.disposeTree(A.root);
      return url;
    }).catch(function () { return null; });
  }
  function stickerPic(id) { return window.STICKERS && STICKERS.has(id) ? STICKERS.thumb(id) : null; }

  // The whole avatar, for the top of the homework page: a strip of 4 frames side by side.
  // Frame 0 stands still; frames 1 to 3 wave with the left arm (the right hand may be holding something).
  var WAVE = [null, -2.3, -2.8, -2.45];
  function portrait(outfit) {
    if (!webglOk()) return Promise.resolve(null);
    return loadThree().then(function () {
      var FW = 200, FH = 280, N = WAVE.length;
      var r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      r.setPixelRatio(1); r.setSize(FW, FH); r.outputEncoding = THREE.sRGBEncoding;
      var sc = new THREE.Scene();
      sc.add(new THREE.HemisphereLight('#FFFFFF', '#9A8F86', 0.75));
      var d = new THREE.DirectionalLight('#FFFFFF', 0.75); d.position.set(3, 8, 8); sc.add(d);
      var cam = new THREE.PerspectiveCamera(24, FW / FH, 0.1, 200);
      var A = ART.buildAvatar(ART.normalise(outfit || {}), {}), holder = new THREE.Group();
      holder.add(A.root); holder.rotation.y = 0.3; sc.add(holder);
      var arm = A.parts.armL, ax = arm.position.x, ay = arm.position.y;
      function pose(i) {
        A.update(1.2, 0);
        arm.position.set(ax, ay, arm.position.z);
        // a raised arm turns about the top of the shoulder, not the middle of the arm
        if (WAVE[i] != null) { arm.position.set(ax + 0.42, ay - 0.3, arm.position.z); arm.rotation.z = WAVE[i]; A.parts.armL.rotation.x = -0.15; A.parts.head.rotation.z = i === 2 ? 0.08 : -0.04; A.parts.head.rotation.y = 0.1; }
        holder.updateMatrixWorld(true);
      }
      // one camera for every frame, so the avatar does not jump between frames
      var box = new THREE.Box3();
      for (var i = 0; i < N; i++) { pose(i); box.union(new THREE.Box3().setFromObject(holder)); }
      var c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3()), tan = Math.tan(cam.fov / 2 * Math.PI / 180);
      var dist = Math.max(sz.y * 0.5 / tan, sz.x * 0.5 / (tan * cam.aspect)) + sz.z / 2;
      cam.position.set(c.x, c.y + dist * 0.12, c.z + dist); cam.lookAt(c);
      var out = document.createElement('canvas'); out.width = FW * N; out.height = FH;
      var ctx = out.getContext('2d');
      for (var j = 0; j < N; j++) { pose(j); r.render(sc, cam); ctx.drawImage(r.domElement, j * FW, 0); }
      var url = out.toDataURL('image/webp', 0.86);
      if (url.indexOf('data:image/webp') !== 0) url = out.toDataURL('image/png');
      ART.disposeTree(A.root); r.dispose();
      return { src: url, frames: N, w: FW, h: FH };
    }).catch(function () { return null; });
  }
  return { open: open, close: close, headshot: headshot, portrait: portrait, stickerPic: stickerPic, _R: R, _sendSticker: sendSticker };
})();
</script>
