<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
  /* ================================================================
     Shared by the Teacher Hub and the student page: colours, type,
     buttons, cards, chips and status pills. Written once, here.
     ================================================================ */
  :root {
    /* a warm page, one bright colour for the main action, navy only for words */
    --ink: #22283A; --muted: #5E6576; --faint: #6F6859;
    --blue: #2A3F7E; --blue-dark: #1E2F63; --blue-soft: #EDF0F8; --navy: #2A3F7E;
    --paper: #FAF6EF; --surface: #FFFFFF; --surface-2: #FBF8F3; --glass: rgba(255,253,249,.94);
    --soft: #F5EFE6; --soft-2: #EEE6D8; --line: #EFE8DC; --rule: #E6DDCF; --track: #F1ECE3; --track-off: #C9D0DB;
    --hl: #FFF4D6; --hl-line: #F0D98A;
    --red: #C23B35; --red-fill: #C23B35; --red-soft: #FDF1F0;
    --yellow: #FFD34D; --yellow-edge: #D9A700; --yellow-ink: #2B2200;
    --green: #1C7A4C; --green-fill: #1C7A4C; --green-soft: #E3F4EA; --green-ink: #15622F;
    --amber: #8A5200; --amber-soft: #FFF1DC; --bad: #B42318;
    --purple: #5B2EA6; --purple-soft: #F1E8FF;
    --claude: #B3552F; --claude-ink: #8A3F22; --claude-soft: #F7E2D7;
    --ink-fill: #22283A; --on-ink-fill: #FFFFFF; --on-ink-muted: #C9CCD6;
    --toast: #262B3B; --veil: rgba(38,30,15,.35); --desk: #E9EDF4;
    /* status pills: on time, late, missing, not due */
    --t-on: #DDF2E6; --t-on-fg: #1B6A45; --t-late: #FFE8D0; --t-late-fg: #86460C; --t-miss: #FBE1DF; --t-miss-fg: #A1262A; --t-nd: #F2EEE7; --t-nd-fg: #6F6859;
    --shadow: 0 1px 2px rgba(70,48,20,.06), 0 8px 24px -8px rgba(70,48,20,.12);
    --shadow-pop: 0 16px 40px rgba(40,30,10,.18);
    --r-card: 18px; --r-btn: 12px;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --text: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  /* Night marking: warm dark greys, the same yellow for the main action. */
  :root[data-theme="dark"] {
    --ink: #F1ECE3; --muted: #BDB5A8; --faint: #A69E91;
    --blue: #AFC1F6; --blue-dark: #D5DEFA; --blue-soft: #2A3147; --navy: #3A4F92;
    --paper: #181612; --surface: #23201B; --surface-2: #2A2620; --glass: rgba(30,27,22,.94);
    --soft: #2E2A23; --soft-2: #3A352C; --line: #38332B; --rule: #4A4439; --track: #3A352C; --track-off: #5A5448;
    --hl: #3B3219; --hl-line: #6A5A28;
    --red: #FF9A90; --red-fill: #C23B35; --red-soft: #3D2522;
    --green: #7CD9A4; --green-fill: #1C7A4C; --green-soft: #1D3528; --green-ink: #8FE2B2;
    --amber: #F4C06E; --amber-soft: #3A2D18; --bad: #FF9A90;
    --purple: #CDB3FF; --purple-soft: #33294A;
    --claude: #B3552F; --claude-ink: #F2A98A; --claude-soft: #45281D;
    --ink-fill: #ECE6DB; --on-ink-fill: #1A1813; --on-ink-muted: #4F4A42;
    --toast: #3B372F; --veil: rgba(0,0,0,.55); --desk: #121110;
    --t-on: #1D3528; --t-on-fg: #8FE2B2; --t-late: #3D2D1A; --t-late-fg: #F6C07C; --t-miss: #40221F; --t-miss-fg: #FF9E94; --t-nd: #2E2A23; --t-nd-fg: #B8B0A2;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.6);
    --shadow-pop: 0 16px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .hidden { display: none !important; }
  a { color: var(--blue); }
  input, select, textarea { background-color: var(--surface); }

  /* Buttons: yellow does the thing, white with a soft edge for everything else, plain words for small links. */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
    border-radius: var(--r-btn); border: 0; background: var(--yellow); color: var(--yellow-ink); box-shadow: 0 3px 0 var(--yellow-edge);
    font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0; cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: transform .08s, box-shadow .08s, background .15s; }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--yellow-edge); }
  .btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule), 0 1px 0 rgba(70,48,20,.06); }
  .btn.ghost:hover { background: var(--soft); }
  .btn.ghost:active:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--rule); }
  .btn.quiet { background: transparent; color: var(--blue); padding: 0 10px; min-height: 40px; box-shadow: none; }
  .btn.quiet:hover { background: var(--soft); }
  .btn.quiet:active:not(:disabled) { box-shadow: none; }
  .btn.yellow { background: var(--yellow); color: var(--yellow-ink); box-shadow: 0 3px 0 var(--yellow-edge); }
  .btn.green { background: var(--green-fill); color: #fff; box-shadow: 0 3px 0 #11553A; }
  .btn.green:active:not(:disabled) { box-shadow: 0 1px 0 #11553A; }
  .btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
  @media (pointer: coarse) { .btn.small, .btn.quiet { min-height: 44px; } }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 18px; height: 18px; flex: none; }

  /* Cards */
  .sheet { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 20px 22px; }

  /* Chips: names, classes and small facts */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 14px; background: var(--red-soft); color: var(--t-miss-fg); border-radius: 999px; padding: 4px 10px; }
  .chip.green { background: var(--green-soft); color: var(--green-ink); }

  /* When something is due */
  .duechip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--soft); color: var(--muted); margin-right: 6px; white-space: nowrap; }
  .duechip.soon { background: var(--hl); color: var(--amber); }
  .duechip.late { background: var(--t-miss); color: var(--t-miss-fg); }
  .duechip.done { background: var(--t-on); color: var(--t-on-fg); }

  /* Status pills: on time, late, missing, not due */
  .spill { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; font: 700 13px var(--text); border-radius: 999px; padding: 5px 10px; min-height: 32px; white-space: nowrap; }
  .spill .ck { font-size: 12px; background: rgba(255,255,255,.7); border-radius: 999px; padding: 0 6px; }
  :root[data-theme="dark"] .spill .ck { background: rgba(0,0,0,.25); }
  .spill.onTime { background: var(--t-on); color: var(--t-on-fg); } .spill.late { background: var(--t-late); color: var(--t-late-fg); }
  .spill.missing { background: var(--t-miss); color: var(--t-miss-fg); cursor: default; } .spill.notDue { background: var(--t-nd); color: var(--t-nd-fg); cursor: default; }

  /* The topic picture on each worksheet */
  .topic { width: 46px; height: 46px; border-radius: 14px; background: var(--topic-bg, var(--hl)); color: var(--topic-fg, var(--amber)); display: grid; place-items: center; flex: none; }
  .topic svg { width: 28px; height: 28px; }
  :root[data-theme="dark"] .topic { background: var(--topic-fg, #8A5A00); color: #fff; }

  /* Boxes */
  .veil { position: fixed; inset: 0; background: var(--veil); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); color: var(--ink); border-radius: 20px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 18px 50px rgba(21,42,110,.3); }
  .modal h2 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0 0 12px; }

  /* Notes at the bottom of the screen */
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 14px; border-radius: 14px;
    padding: 12px 14px 12px 18px; background: var(--toast); color: #fff; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2);
    animation: toastIn .22s cubic-bezier(.2,.8,.2,1); max-width: calc(100vw - 32px); }
  .toast .undo { border: 0; background: rgba(255,255,255,.14); color: #FFE27A; font: 700 14px var(--display); border-radius: 10px; min-height: 36px; padding: 0 12px; cursor: pointer; }
  .toast svg { width: 22px; height: 22px; flex: none; }
  @keyframes toastIn { from { transform: translate(-50%, 16px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
<script>
/* The topic pictures, picked from a worksheet's title or chosen by the teacher. Shared by both pages. */
var WSH = (function () {
  var TOPIC = [
    [/lens|lenses|magnif/i, 'lens', '#E4F3FF', '#1D5F9E', '<ellipse cx="16" cy="16" rx="4.5" ry="11"/><path d="M3 11l8.5 2M3 21l8.5-2M20.5 13L29 16M20.5 19L29 16"/>'],
    [/reflect|mirror/i, 'mirror', '#EEF0FF', '#3E3FA8', '<path d="M5 26h22"/><path d="M8 7l8 19 8-19" /><path d="M16 26V11" stroke-dasharray="2 2.5"/>'],
    [/refract|prism|rainbow|dispers/i, 'prism', '#FFF0F6', '#A3286A', '<path d="M16 5l11 20H5z"/><path d="M2 15l9 2M21 16l9-4M21 18l9 1M21 20l9 5"/>'],
    [/light|shadow|colour|color/i, 'bulb', '#FFF6D6', '#8A5A00', '<path d="M11 20a7 7 0 1110 0c-1.3 1.2-2 2.4-2 4h-6c0-1.6-.7-2.8-2-4z"/><path d="M13 28h6M16 3v-1"/>'],
    [/measur|unit|length|volume|density|mass/i, 'ruler', '#E9F6EE', '#1C6B45', '<rect x="3" y="11" width="26" height="10" rx="2"/><path d="M8 11v4M12 11v6M16 11v4M20 11v6M24 11v4"/>'],
    [/heat|temperat|thermal|conduct|convect|radiat/i, 'thermo', '#FFEDE5', '#B0421B', '<path d="M13 5a3 3 0 016 0v13a6 6 0 11-6 0z"/><circle cx="16" cy="23" r="2.5"/><path d="M16 20v-9"/>'],
    [/electric|circuit|current|voltage|resist/i, 'circuit', '#FFF7E0', '#946200', '<rect x="4" y="9" width="24" height="14" rx="2"/><path d="M11 9v-3M21 9v-3M9 16h6M18 16h5M20.5 13.5v5"/>'],
    [/magnet/i, 'magnet', '#FDEBEC', '#A1262A', '<path d="M7 5v11a9 9 0 0018 0V5h-6v11a3 3 0 01-6 0V5z"/><path d="M7 10h6M19 10h6"/>'],
    [/force|motion|speed|pressure|moment|kinematic/i, 'force', '#EAF1FF', '#2A4EA0', '<rect x="4" y="12" width="10" height="10" rx="2"/><path d="M14 17h14M24 13l4 4-4 4"/>'],
    [/cell|organ|tissue|diffus|osmos|living|plant|photosyn|leaf/i, 'cell', '#EAF7E4', '#3F7A1E', '<ellipse cx="16" cy="16" rx="12" ry="9"/><circle cx="14" cy="15" r="3.5"/><path d="M21 19h.01M9 19h.01M22 12h.01"/>'],
    [/atom|element|compound|particle|matter|molecul|mixture/i, 'atom', '#F2EBFF', '#5B2EA6', '<circle cx="16" cy="16" r="2.5"/><ellipse cx="16" cy="16" rx="12" ry="5"/><ellipse cx="16" cy="16" rx="12" ry="5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="12" ry="5" transform="rotate(120 16 16)"/>'],
    [/acid|alkali|chemi|reaction|salt|indicator/i, 'beaker', '#E5F7F5', '#0E7065', '<path d="M8 5h16M10 5v6l-5 13a3 3 0 002.8 4h16.4a3 3 0 002.8-4l-5-13V5"/><path d="M7 20h18"/>'],
    [/energy|power|work done/i, 'bolt', '#FFF6D6', '#8A5A00', '<path d="M18 3L7 18h8l-2 11 11-15h-8z"/>'],
    [/sound|wave|echo|vibrat/i, 'wave', '#E8F4FF', '#1D5F9E', '<path d="M3 16c3-8 5-8 8 0s5 8 8 0 5-8 8 0"/>']
  ];
  var TOPIC_DEFAULT = ['flask', '#FFF4D6', '#8A5A00', '<path d="M12 4h8M13 4v8l-7 12a3 3 0 002.6 4.5h14.8A3 3 0 0026 24l-7-12V4"/><path d="M9 20h14"/>'];
  function topicOf(title, icon) {
    var i;
    if (icon) { for (i = 0; i < TOPIC.length; i++) if (TOPIC[i][1] === icon) return TOPIC[i].slice(1); if (icon === 'flask') return TOPIC_DEFAULT; }
    for (i = 0; i < TOPIC.length; i++) if (TOPIC[i][0].test(title || '')) return TOPIC[i].slice(1);
    return TOPIC_DEFAULT;
  }
  var TOPIC_NAMES = { lens: 'Lens', mirror: 'Mirror', prism: 'Prism', bulb: 'Light', ruler: 'Measuring', thermo: 'Heat', circuit: 'Circuit', magnet: 'Magnet', force: 'Forces', cell: 'Cells', atom: 'Atoms', beaker: 'Chemistry', bolt: 'Energy', wave: 'Sound', flask: 'Science' };
  function topicHtml(title, icon) {
    var t = topicOf(title, icon);
    return '<span class="topic" style="--topic-bg:' + t[1] + ';--topic-fg:' + t[2] + '" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + t[3] + '</svg></span>';
  }

  return { TOPIC: TOPIC, TOPIC_DEFAULT: TOPIC_DEFAULT, TOPIC_NAMES: TOPIC_NAMES, topicOf: topicOf, topicHtml: topicHtml };
})();
</script>
