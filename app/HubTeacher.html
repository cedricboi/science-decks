<script>
  /* Light or dark: this device's own setting, unless the moon button chose the other look. The choice is kept on this
     device for every learnwithmrcedric page on it, and pages already open change with it. */
  (function () {
    var K = 'ms_theme', root = document.documentElement, mem = '';
    function chosen() { var v = mem; try { v = localStorage.getItem(K) || ''; } catch (e) { /* storage blocked: this page only */ } return v === 'dark' || v === 'light' ? v : ''; }
    function device() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    function now() { return chosen() || device(); }
    function store(v) { mem = v || ''; try { if (v) localStorage.setItem(K, v); else localStorage.removeItem(K); } catch (e) { /* kept in mem */ } }
    // Night chosen earlier on the Teacher Hub or the homework page carries over, once.
    try { if (!localStorage.getItem(K + '_was')) { localStorage.setItem(K + '_was', '1'); if (localStorage.getItem('wsh_theme') === 'dark' || localStorage.getItem('wsh_look') === 'dark') store('dark'); } } catch (e) {}
    function label() {
      var d = now() === 'dark', bs = document.querySelectorAll('.ms-moon');
      for (var i = 0; i < bs.length; i++) { bs[i].setAttribute('aria-pressed', d ? 'true' : 'false'); bs[i].title = d ? 'Dark mode is on (tap for light)' : 'Dark mode'; }
    }
    function apply() {
      var t = now(), was = root.getAttribute('data-theme');
      if (was !== t) {
        root.setAttribute('data-theme', t);
        if (was) { try { window.dispatchEvent(new Event('ms-theme')); } catch (e) { /* very old browser */ } }
      }
      label();
    }
    window.msTheme = {
      now: now, isDark: function () { return now() === 'dark'; }, chosen: chosen, apply: apply, label: label,
      // '' follows the device again
      set: function (v) { store(v === 'dark' || v === 'light' ? v : ''); apply(); },
      // the moon button: the other look; choosing what the device already shows means "follow the device" again
      toggle: function () { var next = now() === 'dark' ? 'light' : 'dark'; store(next === device() ? '' : next); apply(); return next; }
    };
    apply();
    if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply); }
    window.addEventListener('storage', function (e) { if (!e.key || e.key === K) apply(); });
    document.addEventListener('click', function (e) { var b = e.target && e.target.closest ? e.target.closest('.ms-moon') : null; if (b) { e.preventDefault(); window.msTheme.toggle(); } });
    document.addEventListener('DOMContentLoaded', label);
  })();
</script>

  function dropZone(zone, input, onFiles) {
    input.onchange = function () { if (input.files && input.files.length) onFiles(input.files); };
    ['dragenter', 'dragover'].forEach(function (t) { zone.addEventListener(t, function (e) { e.preventDefault(); zone.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (t) { zone.addEventListener(t, function (e) { e.preventDefault(); zone.classList.remove('over'); }); });
    zone.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) onFiles(e.dataTransfer.files); });
  }

  /* ---------------- worksheet detail ---------------- */

  function openDetail(id, step) {
    if (!H.marks || !H.marks.worksheet || H.marks.worksheet.id !== id) H.edits = {};
    if (step) H.step[id] = step;
    setView('detail');
    $('view-detail').innerHTML = skeleton('table');
    return tcall('api_t_marks', id).then(function (m) { H.marks = m; renderDetail(); }).catch(function (e) {
      if (!/TEACHER_SIGNED_OUT/.test(e.message)) $('view-detail').innerHTML = '<p class="empty">' + esc(msg(e)) + '</p>';
    });
  }

  /* ---------- the worksheet page: five steps ---------- */
  var STEPS = [['set', 'Set'], ['hand', 'Hand in'], ['mark', 'Mark'], ['return', 'Return'], ['corr', 'Corrections']];
  H.step = {};
  function defaultStep(w) {
    var marked = w.markedFiles > 0 || w.scored > 0;
    if (w.job && (solDrafting(w) || w.job.status === 'solution_ready' || (w.job.status === 'error' && w.job.phase === 'solution'))) return 'set';
    if (w.job && (jobBusy(w) || w.job.status === 'sample_ready' || w.job.status === 'error')) return 'mark';
    if (w.open && !w.isDue) return 'hand';
    if (w.handed && !marked) return 'mark';
    if (marked && !w.showMarked) return 'return';
    if (w.showMarked && w.hasAnswerKey && !w.showAnswers) return 'return';
    if (w.showMarked && w.corrDue) return 'corr';
    return w.showMarked ? 'return' : 'hand';
  }
  function stepInfo(w, k) {
    var marked = w.markedFiles > 0 || w.scored > 0;
    switch (k) {
      case 'set': return [true, w.hasSolution ? 'Solution added' : solDrafting(w) ? 'Claude is drafting' : w.job && w.job.status === 'solution_ready' ? 'Draft to check' : 'No solution yet'];
      case 'hand': return [!w.open || w.isDue, (w.open ? 'Open · ' : 'Closed · ') + w.handed + ' of ' + w.total + ' in'];
      case 'mark': return [marked, jobBusy(w) ? 'Claude is marking' : marked ? w.markedFiles + ' marked' : 'Not marked'];
      case 'return': return [!!w.showMarked, w.showMarked ? (w.showAnswers ? 'Marking and answers out' : 'Released') : 'Not released'];
      case 'corr': return [w.showMarked && (!w.correctionsOpen || (w.corrDue && w.corrDone >= w.corrDue)), w.showMarked ? (w.correctionsOpen ? w.corrDone + ' of ' + w.corrDue + ' in' : 'Closed') : 'After release'];
    }
  }
  function sw(id, on, disabled, title, small) {
    return '<label class="switch' + (disabled ? ' off' : '') + '"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + (disabled ? ' disabled' : '') + '><span class="track"></span><span><span class="ss">' + title + '</span><small>' + small + '</small></span></label>';
  }
  function fileId(url) { var m = String(url || '').match(/\/d\/([\w-]{10,})/) || String(url || '').match(/[?&]id=([\w-]{10,})/); return m ? m[1] : ''; }
  var DOC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v12a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M15 3v4h4"/></svg>';
  function fileTile(label, url, upload) {
    var id = fileId(url);
    return '<div class="file' + (url ? '' : ' none') + '"><div class="thumb">' + (id ? '<img alt="" loading="lazy" src="https://drive.google.com/thumbnail?id=' + esc(id) + '&sz=w320" onerror="this.replaceWith(document.createRange().createContextualFragment(this.getAttribute(\'data-f\')))" data-f="' + esc(DOC_SVG) + '">' : DOC_SVG) + '</div>' +
      '<div class="fb"><b>' + esc(label) + '</b><div class="row">' + (url ? '<a class="btn small ghost" href="' + esc(url) + '" target="_blank" rel="noopener">Open</a>' : '<span class="muted" style="font-size:13px">Not added yet</span>') + (upload || '') + '</div></div></div>';
  }
  function upBtn(id, has, what) {
    return '<label class="btn small ghost keyfile">' + ICON.up + (has ? 'Replace' : 'Upload') + '<input type="file" id="' + id + '" accept=".pdf,application/pdf" aria-label="' + (has ? 'Replace ' : 'Upload ') + what + '"></label>';

  function chipsFor(names) { return names.map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join(''); }

  // Claude's draft of the marked solution: start it, follow it, check it.
  function solutionLine(w, inMark) {
    var j = w.job, connected = !!(H.dash && H.dash.claude && H.dash.claude.connected);

      (j.sessionUrl ? '<p style="margin:6px 0 0"><a href="' + esc(j.sessionUrl) + '" target="_blank" rel="noopener">See what Claude is doing</a></p>' : '') + '</div>';

    h += '<div class="stepbar" role="tablist" aria-label="Steps">' + STEPS.map(function (st, i) {

    if (w.autoMark) autoBits.push(!w.isDue ? 'Claude starts marking when it closes' : w.hasSolution ? 'Claude started marking by itself' : 'Claude starts marking once the marked solution is saved');
    P.hand = '<h3>Hand in</h3>' + (autoBits.length ? '<div class="autoline">' + autoBits.map(function (b) { return '<span>' + esc(b) + '</span>'; }).join('') + '</div>' : '') + '<div class="switches">' +
      sw('sw-open', w.open, false, w.open ? 'Students can hand in' + (w.dueTs ? ', due ' + esc(dueWords(w)) : '') : 'Hand-in is closed',

        '<div class="detail-acts"><button class="btn ghost" id="d-nudge">' + ICON.student + 'Copy a reminder</button></div>' : '<p class="muted" style="margin:0">Everyone has handed in.</p>') + '</div>' +
      '<div class="detail-acts" style="margin-top:14px"><button class="btn ghost" id="d-zip">' + ICON.down + 'Download zip</button></div>' +
      '<div class="helpbox" id="d-help"></div>';
    P.mark = '<h3>Mark</h3><p class="lead">' + (w.hasSolution ? 'Claude marks against your marked solution, or mark by hand.' : 'Add your marked solution first, then Claude can mark against it.') + '</p>' +
      (w.hasSolution ? '' : solutionLine(w, true)) +
      '<div class="detail-acts">' +
      (w.handed && !jobBusy(w) && !(w.job && /^(sample_ready|solution_ready)$/.test(w.job.status)) ? '<button class="btn claude" id="d-claude">' + ICON.spark + 'Mark with Claude</button>' : '') +
      (w.handed ? '<button class="btn" id="d-check">' + ICON.pen + (w.markedFiles ? 'Check marking' : 'Mark by hand') + '</button>' : '') +
      '<button class="btn ghost" id="d-ret">' + ICON.up + 'Return marked work</button>' +
      (w.reportUrl ? '<a class="btn ghost" href="' + esc(w.reportUrl) + '" target="_blank" rel="noopener">Class report</a>' : '') +
      '<label class="btn ghost keyfile">' + ICON.up + (w.hasSolution ? 'Replace marked solution' : 'Upload marked solution') + '<input type="file" id="d-sol-m" accept=".pdf,application/pdf"></label></div>' +
      (j && j.status === 'done' ? claudeBox(w, rows, true) : '');
    P['return'] = '<h3>Return</h3><div class="switches">' +
      sw('sw-rel', w.showMarked, false, w.showMarked ? 'Students can see their marking' : 'Marking is hidden from students', w.showMarked ? 'Marked copy, score and comment are on their profile.' : 'Hidden until you turn this on.') +
      sw('sw-ans', w.showAnswers, !w.hasAnswerKey, !w.hasAnswerKey ? 'No answer key yet' : w.showAnswers ? 'Students can see the answer key' : 'The answer key is hidden',
        !w.hasAnswerKey ? 'No answer key yet. It comes in the return file.' : w.showAnswers ? 'The answer key is on their profile.' : 'Answer key uploaded. Hidden until you turn this on.') + '</div>' +
      '<div class="detail-acts">' + (w.answerUrl ? '<a class="btn ghost" href="' + esc(w.answerUrl) + '" target="_blank" rel="noopener">' + ICON.key + 'Answer key</a>' : '') +
      '<label class="btn ghost keyfile">' + ICON.up + (w.hasAnswerKey ? 'Replace answer key' : 'Upload answer key') + '<input type="file" id="d-key" accept=".pdf,application/pdf"></label></div>';
    P.corr = '<h3>Corrections</h3><div class="switches">' +
      sw('sw-corr', w.correctionsOpen, false, !w.showMarked ? 'Corrections open after you release the marking' : w.correctionsOpen ? 'Students can hand in corrections' : 'Corrections are closed',
        !w.showMarked ? 'Students can do corrections once you release the marking.' : w.correctionsOpen ? 'Students can hand in corrections in green.' : 'Closed. Students cannot hand in corrections.') + '</div>';
    if (w.showMarked && w.corrDue) {
      P.corr += '<div class="missing-box"><p class="muted" style="margin:0 0 8px">' + w.corrDone + ' of ' + w.corrDue + ' handed in' + (w.correctionsOpen ? '' : '. Corrections are closed') + '. Students with full marks do not need to do corrections.</p>';
      if (w.corrOwed.length) P.corr += '<div class="cls-label">' + (w.correctionsOpen ? 'Still to hand in' : 'Did not hand in') + ', ' + w.corrOwed.length + '</div><div class="chips">' + chipsFor(w.corrOwed) + '</div>';
      else P.corr += '<p style="margin:0"><span class="chip green">Everyone who needs to has handed in corrections.</span></p>';
      P.corr += '</div>';
    }

    STEPS.forEach(function (st) { h += '<div class="sheet panel' + (st[0] === step ? '' : ' hidden') + '" id="p-' + st[0] + '" role="tabpanel">' + P[st[0]] + '</div>'; });

    // the marks table

    var many = vis.some(function (r) { return r.cls !== (vis[0] || {}).cls; });
    h += '<div class="sheet marks"><div class="marks-head"><h3 style="margin:0">Marks' + (H.cls ? ' for ' + esc(H.cls) : '') + '</h3>' + tip('Type a score in the box. Tap a student for their comment and the Mostly blank tick. Students see them when marking is released. J and K move between students, S saves.') +
      '<span class="spacer"></span><button class="btn ghost small noprint" id="d-print">' + ICON.print + 'Print</button><span class="printonly">' + esc(w.title + ' · ' + w.classText + (w.due ? ' · due ' + w.due : '')) + '</span></div>' +
      spreadHtml(vis) +
      (notIn.length ? '<div class="notin"><b>Not handed in</b><div class="chips">' + chipsFor(notIn.reduce(function (a, pc) { return a.concat(pc.notHanded); }, [])) + '</div><button class="btn small ghost" id="d-nudge2">Copy a reminder</button></div>' : '') +
      '<div class="table-wrap"><table class="mk"><thead><tr><th>Name</th>' + (many ? '<th>Class</th>' : '') + '<th>Script</th><th>Score</th><th style="width:34%">Comment</th><th></th><th>Corrections</th></tr></thead><tbody>';

        (many ? '<td><span class="status-dot" style="display:inline-block;width:8px;height:8px;margin-right:6px;background:' + ccOf(r.cls) + ';box-shadow:none"></span>' + esc(r.cls) + '</td>' : '') +
        '<td>' + (can && !r.pending ? '<button class="spill ' + r.kind + ' chkbtn" title="' + (r.checked ? 'Checked ' + esc(r.checked) : 'Open the script') + '">' + esc(r.status) + (r.checked ? '<span class="ck">&#10003; checked</span>' : r.markedUrl ? '<span class="ck">check</span>' : '<span class="ck">mark</span>') + '</button>' : '<span class="spill ' + r.kind + '"' + (r.pending ? ' title="Handed in automatically. The PDF is being made from the saved work."' : '') + '>' + esc(r.status) + (r.pending ? '<span class="ck">preparing</span>' : '') + '</span>') +

  // A small bar chart of the scores, so the class picture is clear before reading the rows.
  function parseScore(sc) {
    var m = String(sc || '').match(/^\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*$/);
    if (m && Number(m[2]) > 0) return { got: Number(m[1]), max: Number(m[2]) };
    m = String(sc || '').match(/^\s*(\d+(?:\.\d+)?)\s*%\s*$/);
    return m ? { got: Number(m[1]), max: 100 } : null;
  }
  function spreadHtml(rows) {
    var ps = rows.map(function (r) { return parseScore(r.score); }).filter(Boolean);
    if (ps.length < 3) return '';
    var max = ps[0].max, same = ps.every(function (p) { return p.max === max; }) && max <= 20 && max === Math.round(max);
    var n = same ? max + 1 : 11, bins = []; for (var b = 0; b < n; b++) bins.push(0);
    ps.forEach(function (p) { bins[same ? Math.round(p.got) : Math.min(10, Math.floor(10 * p.got / p.max))]++; });
    var top = Math.max.apply(null, bins), W = 520, Hh = 64, bw = W / n;
    var pct = ps.map(function (p) { return p.got / p.max; }).sort(function (a, c) { return a - c; }), mid = pct[Math.floor(pct.length / 2)];
    var svg = '<svg viewBox="0 -14 ' + W + ' ' + (Hh + 30) + '" role="img" aria-label="How the scores are spread">' + bins.map(function (c, i) {
      var bh = top ? Math.max(c ? 4 : 0, Hh * c / top) : 0, x = i * bw + 3;
      return '<rect x="' + x.toFixed(1) + '" y="' + (Hh - bh).toFixed(1) + '" width="' + (bw - 6).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="4" fill="' + (i / (n - 1) >= 0.7 ? '#1C7A4C' : i / (n - 1) >= 0.5 ? '#E0A100' : '#C9695A') + '"/>' +
        (c ? '<text class="sp-n" x="' + (x + (bw - 6) / 2).toFixed(1) + '" y="' + (Hh - bh - 4).toFixed(1) + '" text-anchor="middle">' + c + '</text>' : '') +
        '<text class="sp-t" x="' + (x + (bw - 6) / 2).toFixed(1) + '" y="' + (Hh + 14) + '" text-anchor="middle">' + (same ? i : i * 10 + '%') + '</text>';
    }).join('') + '</svg>';
    return '<div class="spread"><div class="sum"><b>' + (same ? fmtN(mid * max) + '/' + max : Math.round(100 * mid) + '%') + '</b><span>middle score of ' + ps.length + '</span></div>' + svg + '</div>';
  }

  // Copies a reminder for the students who have not handed in.
  function nudge(w) {
    var names = w.perClass.filter(function (pc) { return !H.cls || pc.cls === H.cls; }).reduce(function (a, pc) { return a.concat(pc.notHanded.map(function (n) { return n; })); }, []);
    var text = 'Reminder: please hand in "' + w.title + '" on the Worksheet Hub' + (w.due ? (w.isDue ? '. It was due ' : ' by ') + w.due : '') + '.\nStill to hand in: ' + names.join(', ') + '.';
    var done = function () { toast('Reminder copied. Paste it into your class chat.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { showText(); });
    else showText();
    function showText() {
      modal('<h2>Reminder</h2><p>Copy this and paste it into your class chat.</p><textarea id="nd-t" style="width:100%;min-height:120px;border:1.5px solid var(--rule);border-radius:10px;padding:10px;font:inherit">' + esc(text) + '</textarea><div class="foot"><button class="btn" id="nd-ok">Done</button></div>');
      $('nd-t').select(); $('nd-ok').onclick = closeModal;

  }
  H.edits = {};
  // Records a change to one student's mark, and forgets it again if it matches what is saved.
  function setEdit(i, f, v) {
    var r = H.marks.rows[i], e = H.edits[i] || {};
    e[f] = v;
    var same = (e.score === undefined || e.score === r.score) && (e.comment === undefined || e.comment === r.comment) && (e.blank === undefined || e.blank === !!r.blank);
    if (same) delete H.edits[i]; else H.edits[i] = e;
    var tr = document.querySelector('table.mk tr[data-i="' + i + '"]');
    if (tr) {
      tr.classList.toggle('dirty', !same);
      if (f === 'comment') tr.querySelector('td.cm').textContent = v;
      if (f === 'blank') tr.children[tr.children.length - 2].innerHTML = v ? '<span class="blankflag" title="More than half left blank">Blank</span>' : '';
      if (f === 'score' && document.activeElement !== tr.querySelector('input.score')) tr.querySelector('input.score').value = v;

  }

    dr.innerHTML = '<div class="dh"><div style="flex:1;min-width:0"><b>' + esc(r.name) + '</b><span class="muted" style="font-size:14px">' + esc(r.cls) + (r.reg ? ' · ' + esc(r.reg) : '') + ' · ' + esc(r.status) + (r.handedAt ? ' · ' + esc(r.handedAt) : '') + '</span></div>' +
      '<button class="btn quiet dx" id="dr-x" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="db">' +

        '<div><label class="lb" for="dr-comment">Comment</label><textarea id="dr-comment" placeholder="A short comment the student sees">' + esc(comment) + '</textarea></div>' +
        '<label class="blankrow"><input type="checkbox" id="dr-blank"' + (blank ? ' checked' : '') + '><span><b>Mostly blank</b><br><span class="muted" style="font-size:14px">More than half of the paper was left blank. The student loses points.</span></span></label>' +

      '</div><div class="df"><button class="btn ghost small" id="dr-prev"' + (at <= 0 ? ' disabled' : '') + '>&larr; Previous</button><span class="spacer"></span><button class="btn ghost small" id="dr-next"' + (at >= order.length - 1 ? ' disabled' : '') + '>Next &rarr;</button><button class="btn small" id="dr-done">Done</button></div>';

    var tr = document.querySelector('table.mk tr[data-i="' + i + '"]'); if (tr) { tr.classList.add('sel'); tr.scrollIntoView({ block: 'nearest' }); }
    $('dr-x').onclick = closeDrawer; $('dr-done').onclick = closeDrawer;

  /* ---------------- marking by Claude ---------------- */

  var JOB_TEXT = {
    queued: 'Claude is starting on the sample...', queued_rest: 'Claude is starting on the rest...',
    marking_sample: 'Claude is marking one sample...', marking: 'Claude is marking the class...',
    sample_ready: 'Sample marked. Check it, then let Claude mark the rest.', done: 'Claude has finished marking.',
    error: 'Claude could not finish.',
    queued_solution: 'Claude is starting on the marked solution...', drafting_solution: 'Claude is drafting the marked solution...',
    solution_ready: 'Claude has drafted the marked solution. Check it and save it.'
  };
  function jobBusy(w) { return !!(w.job && /^(queued|queued_rest|marking|marking_sample|queued_solution|drafting_solution)$/.test(w.job.status)); }
  function solDrafting(w) { return !!(w.job && /^(queued_solution|drafting_solution)$/.test(w.job.status)); }
  function jobLine(w) {
    var j = w.job;

    var txt = j.status === 'error' && j.phase === 'solution' ? 'Claude could not draft the marked solution.' : JOB_TEXT[j.status];
    if (j.auto && /^(queued|marking_sample)$/.test(j.status)) txt += ' It started by itself at the due time.';
    return '<p class="job-line' + cls + '">' + (jobBusy(w) ? '<span class="pulse" aria-hidden="true"></span>' : '') + esc(txt) + '</p>';
  }

  // Claude's progress: sample, your check, the rest, done. Folds to one line once it is done.
  function claudeBox(w, rows, folded) {

    if (!j || !JOB_TEXT[j.status]) return '';
    var st = j.status, stage = /^(queued|marking_sample)$/.test(st) ? 0 : st === 'sample_ready' ? 1 : /^(queued_rest|marking)$/.test(st) ? 2 : st === 'done' ? 3 : -1;
    var steps = ['Sample', 'Your check', 'Mark the rest', 'Done'];
    var h = '<div class="sheet missing-box claude-box' + (folded ? ' folded' : '') + '" id="claude-box">';
    h += '<div class="fold-line"><h3 style="margin:0;flex:1">Marking by Claude</h3>' + (folded ? '<button class="btn small ghost" id="cl-fold">Details</button>' : '') + '</div>';
    h += '<p style="margin:6px 0 6px">' + jobLine(w).replace(/^<p class="job-line[^"]*">|<\/p>$/g, '') + (j.updated ? ' <span class="muted">(' + esc(j.updated) + ')</span>' : '') + '</p>';
    h += '<div class="fold-body">';
    if (stage >= 0) h += '<div class="cprog" aria-label="Progress">' + steps.map(function (x, i) { return '<span class="' + (i < stage || stage === 3 ? 'done' : i === stage ? 'now' : '') + '">' + (i < stage || stage === 3 ? '&#10003; ' : '') + x + '</span>'; }).join('') + '</div>';
    if (j.message) h += '<p style="margin:0 0 6px">' + esc(j.message) + '</p>';
    var checks = '';
    if (j.checks && j.checks.length) {
      var ticked = JSON.parse(lsGet('wsh_chk_' + w.id) || '[]');
      checks = '<p style="margin:10px 0 0;font-weight:700">Please check</p><ul class="checklist">' + j.checks.map(function (c, i) {
        return '<li><label><input type="checkbox" data-chk="' + i + '"' + (ticked.indexOf(i) >= 0 ? ' checked' : '') + '><span>' + esc(c) + '</span></label></li>'; }).join('') + '</ul>';
    }
    if (st === 'sample_ready') {
      var r = (rows || []).filter(function (x) { return x.markedUrl && j.sampleFile && x.name && j.sampleFile.indexOf(x.name) >= 0; })[0];
      var fid = r ? fileId(r.markedUrl) : '';
      h += '<div class="sample-grid' + (fid ? '' : ' one') + '"><div>' + (fid ? '<iframe title="The marked sample" src="https://drive.google.com/file/d/' + esc(fid) + '/preview" loading="lazy"></iframe>' : '') +
        (r ? '<p style="margin:8px 0 0;display:flex;gap:8px;flex-wrap:wrap"><a class="btn small ghost" href="' + esc(r.markedUrl) + '" target="_blank" rel="noopener">Open the PDF</a><button class="btn small" id="cl-checksample" data-i="' + rows.indexOf(r) + '">' + ICON.pen + 'Check the sample (' + esc(r.name) + ')</button></p>' : '') + '</div>' +
        '<div><label for="cl-note" class="lbl" style="font-weight:700">Anything to change? (optional)</label>' +
        '<textarea id="cl-note" placeholder="For example: accept &quot;bends&quot; for &quot;refracts&quot; in 2(a)."></textarea>' +
        '<div class="acts" style="margin-top:10px"><button class="btn claude" id="cl-rest">Mark the rest</button><button class="btn ghost" id="cl-redo">Mark the sample again with my note</button></div>' + checks + '</div></div>';
    } else h += checks;
    var nFlag = (rows || []).filter(function (r) { return r.handedAt && flagged(r, (j.checks || []).map(function (c) { return String(c).toLowerCase(); })); }).length;

  function loadScriptFrom(urls) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= urls.length) { reject(new Error('Could not load the tool that opens PDFs. Check the internet connection.')); return; }
        var s = document.createElement('script'); s.src = urls[i++];
        s.onload = function () { resolve(); }; s.onerror = function () { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
  }
  var pdfReady = null;
  function loadPdfLibs() {
    if (pdfReady) return pdfReady;
    pdfReady = Promise.all([
      window.pdfjsLib ? Promise.resolve() : loadScriptFrom(PDF_LIBS.pdfjs),
      window.PDFLib ? Promise.resolve() : loadScriptFrom(PDF_LIBS.pdflib)
    ]).then(function () {
      var urls = PDF_LIBS.worker.slice();
      function tryNext() {
        if (!urls.length) { pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_LIBS.worker[0]; return; }
        var u = urls.shift();
        return fetch(u).then(function (r) { if (!r.ok) throw new Error('bad'); return r.text(); })
          .then(function (t) { pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'application/javascript' })); })
          .catch(tryNext);
      }
      return tryNext();
    });
    pdfReady.catch(function () { pdfReady = null; });
    return pdfReady;
  }
  function b64Bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);

    return btoa(s);

  function fmtN(n) { n = Math.round(n * 10) / 10; return String(n); }

  // The students with a hand-in on this worksheet, in the order of the marks table.

  function claudeChecks(id) { var j = ((byId(id) || {}).job) || (H.marks && H.marks.worksheet && H.marks.worksheet.job) || {}; return (j.checks || []).map(function (c) { return String(c).toLowerCase(); }); }
  function flagged(r, checks) { var n = String(r.name || '').toLowerCase().trim(); return !!n && checks.some(function (c) { return c.indexOf(n) >= 0; }); }
  function reviewQueue() {
    var rows = (H.marks.rows || []).filter(function (r) { return !!r.handedAt && !r.pending; });
    var checks = claudeChecks(H.marks.worksheet && H.marks.worksheet.id);
    if (!checks.length) return rows;
    return rows.filter(function (r) { return flagged(r, checks); }).concat(rows.filter(function (r) { return !flagged(r, checks); }));

    R = { id: H.marks.worksheet.id, row: r, queue: q, zoom: null, tool: 'tick', color: RV_PENS[0][0], size: 1,

      finger: false, penSeen: false, showClaude: true, cache: {} };

  function fetchReview(r) {
    if (R.solution) return tcall('api_t_solution', R.id);
    var k = r.cls + '|' + r.name;
    if (R.cache[k]) return R.cache[k];
    var p = tcall('api_t_review', R.id, r.cls, r.name);
    R.cache[k] = p;
    p.catch(function () { delete R.cache[k]; });
    return p;
  }

  function loadReview(r) {
    R.row = r; R.dirty = false; R.undo = []; R.redo = []; R.pages = []; R.data = null;
    $('review').innerHTML = '<div class="rv-loading"><div class="spinner"></div>Opening ' + esc(r.name) + '...</div>';
    Promise.all([loadPdfLibs(), fetchReview(r)]).then(function (res) {
      var d = res[1];
      if (!R || R.row !== r) return null;
      R.data = d;
      R.bytes = b64Bytes(d.b64);
      delete R.cache[r.cls + '|' + r.name];
      return pdfjsLib.getDocument({ data: R.bytes.slice() }).promise;
    }).then(function (pdf) {
      if (!pdf) return null;

      for (var i = 1; i <= pdf.numPages; i++) jobs.push(pdf.getPage(i));

  // The marks as the checking screen keeps them.

    });

    h += '<div class="rv-body"><div class="rv-pages" id="rv-pages"></div><aside class="rv-side" id="rv-side"></aside></div>';
    $('review').innerHTML = h;
    if (R.solution) $('review').querySelector('.rv-nav').classList.add('hidden');
    R.pages.forEach(function (pg, i) {
      var el = document.createElement('div'); el.className = 'pg'; el.setAttribute('data-i', i);
      el.innerHTML = '<canvas class="base"></canvas><canvas class="ink" aria-label="Page ' + (i + 1) + '"></canvas>';
      $('rv-pages').appendChild(el);
      pg.el = el; pg.base = el.children[0]; pg.ink = el.children[1];
      bindInk(pg, i);
    });
    renderSide();
    bindReviewTop();
    setRvTool(R.tool);
    if (R.zoom == null) R.zoom = fitZoom();
    layoutPages();
    $('rv-pages').classList.toggle('finger', R.finger);
  }

  function tb(tool, icon, title) {
    return '<button class="tb" data-tool="' + tool + '" aria-pressed="false" title="' + title + '" aria-label="' + title + '">' + icon + '</button>';
  }

  function fitZoom() {
    var box = $('rv-pages'), wmax = 0;
    R.pages.forEach(function (p) { wmax = Math.max(wmax, p.w); });
    var z = (box.clientWidth - 32) / (wmax || 595);
    return Math.max(0.5, Math.min(2, z));
  }

  function layoutPages() {
    var z = R.zoom, dpr = window.devicePixelRatio || 1;
    $('rv-zl').textContent = Math.round(z * 100) + '%';
    R.pages.forEach(function (pg) {
      var cw = pg.w * z, ch = pg.h * z;
      pg.el.style.width = cw + 'px'; pg.el.style.height = ch + 'px';
      var k = Math.min(dpr, Math.sqrt(MAX_PX / (cw * ch)));
      pg.k = k;
      [pg.base, pg.ink].forEach(function (c) { c.width = Math.round(cw * k); c.height = Math.round(ch * k); });
      renderBase(pg);
      drawInk(pg);
    });
  }

  function renderBase(pg) {
    var z = R.zoom * pg.k, vp = pg.p.getViewport({ scale: z });
    if (pg.task) { try { pg.task.cancel(); } catch (e) { /* ignore */ } }
    var ctx = pg.base.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pg.base.width, pg.base.height);
    pg.task = pg.p.render({ canvasContext: ctx, viewport: vp });
    pg.task.promise.catch(function () { /* cancelled by a newer render */ });
  }

  /* ----- drawing the marks (page points, top-left origin, the same frame Claude uses) ----- */

  // Symbols as line lists [x0, y0, x1, y1, ...], so the screen and the PDF draw exactly the same shapes.
  // Marks are big and bold so it is obvious the work has been marked. The same sizes as Claude's marking script
  // (markforge annotate.py), so a script looks the same after you change it. MARK_W is the line thickness.
  var MARK_W = 2.2;
  function tickLines(x, y) { return [[x - 10, y, x - 3.5, y + 7.5, x + 10, y - 11]]; }
  function crossLines(x, y) { return [[x - 7, y + 7, x + 7, y - 7], [x - 7, y - 7, x + 7, y + 7]]; }
  // The margin beside each question: a tick for full marks, otherwise a cross (never a half tick). The mark itself
  // (such as 1/2) sits beside it.
  function marginLines(g, mx, x, T) {
    var s = 14, b = T + 3;
    if (g >= mx) return [[x, b - 0.45 * s, x + 0.38 * s, b, x + s, b - s]];
    s = 12; return [[x + 1, b, x + 1 + s, b - s], [x + 1, b - s, x + 1 + s, b]];
  }
  function ellipseLine(cx, cy, rx, ry) {
    var a = [];
    for (var i = 0; i <= 48; i++) { var t = i / 48 * Math.PI * 2; a.push(cx + rx * Math.cos(t), cy + ry * Math.sin(t)); }
    return a;
  }

  // Everything drawn from the marks panel: the margin marks, the MCQ box marks and the circled total.
  function derived(pageNo, pg) {
    var out = [];
    if (!R.layout || !R.margin) return out;
    var blank = R.data.review && R.data.review.blank;
    R.layout.items.forEach(function (it) {
      var g = Number(R.items[it.q].got) || 0, mx = Number(it.max) || 0;
      if (it.page === pageNo) {
        var x = pg.w - 36, T = it.top + 9;
        out.push({ lines: marginLines(g, mx, x - 18, T), w: 2 });
        out.push({ text: fmtN(g) + '/' + mx, x: x + 1, y: T, size: 11, bold: true });
      }
      if (it.box && it.box.page === pageNo && !blank) out.push({ lines: g >= mx ? tickLines(it.box.x, it.box.y) : crossLines(it.box.x, it.box.y), w: MARK_W });
    });
    if (pageNo === 1) {
      var t = totals();
      out.push({ lines: [ellipseLine(pg.w - 63, 33, 45, 19)], w: 2.2 });
      out.push({ text: fmtN(t.got) + '/' + t.max, cx: pg.w - 63, y: 39, size: 16, bold: true });
    }
    return out;
  }

  function strokeLines(ctx, lines) {
    lines.forEach(function (ln) {
      ctx.beginPath(); ctx.moveTo(ln[0], ln[1]);
      for (var k = 2; k < ln.length; k += 2) ctx.lineTo(ln[k], ln[k + 1]);
      ctx.stroke();
    });
  }

  function objLines(o) { return o.k === 'tick' ? tickLines(o.x, o.y) : o.k === 'cross' ? crossLines(o.x, o.y) : null; }

  function drawObj(ctx, o) {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (o.k === 'tick' || o.k === 'cross') {
      ctx.strokeStyle = o.c || MARK_RED; ctx.lineWidth = MARK_W;
      strokeLines(ctx, objLines(o));
    } else if (o.k === 'ink') {
      ctx.strokeStyle = o.c; ctx.lineWidth = o.w;
      var p = o.p;
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      if (p.length === 1) ctx.lineTo(p[0][0] + 0.01, p[0][1]);
      for (var i = 1; i < p.length - 1; i++) ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
      if (p.length > 1) ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
      ctx.stroke();
    } else if (o.k === 'text') {
      ctx.fillStyle = o.c; ctx.font = o.sz + 'px Helvetica, Arial, sans-serif'; ctx.textBaseline = 'alphabetic';
      String(o.t).split('\n').forEach(function (line, j) { ctx.fillText(line, o.x, o.y + j * o.sz * 1.2); });
    }
    ctx.restore();
  }

  function drawInk(pg) {
    var i = R.pages.indexOf(pg), ctx = pg.ink.getContext('2d'), s = R.zoom * pg.k;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, pg.ink.width, pg.ink.height);
    ctx.setTransform(s, 0, 0, s, 0, 0);
    derived(i + 1, pg).forEach(function (d) {
      ctx.save(); ctx.strokeStyle = MARK_RED; ctx.fillStyle = MARK_RED; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (d.lines) { ctx.lineWidth = d.w; strokeLines(ctx, d.lines); }
      else {
        ctx.font = 'bold ' + d.size + 'px Helvetica, Arial, sans-serif';
        var x = d.cx != null ? d.cx - ctx.measureText(d.text).width / 2 : d.x;
        ctx.fillText(d.text, x, d.y);
      }
      ctx.restore();
    });
    R.objects.forEach(function (o) {
      if (o.page !== i + 1) return;
      if (o.by === 'claude' && !R.showClaude) return;
      drawObj(ctx, o);
    });
    if (R.live && R.live.page === i + 1) drawObj(ctx, R.live);
  }

  function redrawPage(n) { var pg = R.pages[n - 1]; if (pg) drawInk(pg); }
  function redrawAll() { R.pages.forEach(drawInk); }

  /* ----- input ----- */

  function pagePoint(pg, e) {
    var b = pg.ink.getBoundingClientRect();
    return [(e.clientX - b.left) / R.zoom, (e.clientY - b.top) / R.zoom];
  }

  function record() {
    R.undo.push(JSON.stringify(R.objects));
    if (R.undo.length > 200) R.undo.shift();
    R.redo = [];
    setDirty();
  }
  function setDirty() {
    R.dirty = true;
    if ($('rv-undo')) { $('rv-undo').disabled = !R.undo.length; $('rv-redo').disabled = !R.redo.length; }
  }

  function hitObj(page, x, y, rad) {
    for (var j = R.objects.length - 1; j >= 0; j--) {
      var o = R.objects[j];
      if (o.page !== page || (o.by === 'claude' && !R.showClaude)) continue;
      if (o.k === 'tick' || o.k === 'cross') { if (Math.hypot(o.x - x, o.y - y) < 12 + rad) return j; }
      else if (o.k === 'text') {
        var lines = String(o.t).split('\n'), wmax = 0;
        lines.forEach(function (l) { wmax = Math.max(wmax, l.length * o.sz * 0.55); });
        if (x > o.x - rad && x < o.x + wmax + rad && y > o.y - o.sz - rad && y < o.y + (lines.length - 1) * o.sz * 1.2 + rad) return j;
      } else if (o.k === 'ink') {
        for (var k = 0; k < o.p.length; k++) {
          var a = o.p[k], b = o.p[Math.min(k + 1, o.p.length - 1)];
          if (segDistance(x, y, a[0], a[1], b[0], b[1]) < rad + o.w) return j;
        }
      }
    }
    return -1;
  }
  function segDistance(px, py, x0, y0, x1, y1) {
    var dx = x1 - x0, dy = y1 - y0, L = dx * dx + dy * dy, t = L ? Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / L)) : 0;
    return Math.hypot(px - (x0 + t * dx), py - (y0 + t * dy));
  }

  function eraseAt(page, x, y) {
    var j = hitObj(page, x, y, 5);
    if (j < 0) return false;
    if (!R.erasing) { record(); R.erasing = true; }
    R.objects.splice(j, 1);
    redrawPage(page);
    return true;
  }

  function bindInk(pg, i) {
    var c = pg.ink, active = null;
    c.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'pen') { R.penSeen = true; }
      var touch = e.pointerType === 'touch';
      // A finger scrolls unless Finger draws is on. A tap still places a tick, a cross or text, or erases.
      if (touch && !R.finger) {
        if (R.tool === 'move') {
          // In Move a finger picks up a mark; anywhere else it scrolls the pages.
          var mp = pagePoint(pg, e);
          if (hitObj(i + 1, mp[0], mp[1], 8) < 0) {
            var box = $('rv-pages');
            e.preventDefault();
            try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
            active = { pan: true, id: e.pointerId, x: e.clientX, y: e.clientY, sl: box.scrollLeft, st: box.scrollTop };
            return;
          }
        } else {
          if (R.tool !== 'pen') active = { tap: true, id: e.pointerId, start: pagePoint(pg, e) };
          return;
        }
      }
      e.preventDefault();
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      var pt = pagePoint(pg, e);
      active = { id: e.pointerId, start: pt };
      startAction(i + 1, pt);
    });
    c.addEventListener('pointermove', function (e) {
      if (!active && e.pointerType !== 'touch') {
        var hp = pagePoint(pg, e), j = R.tool === 'move' || R.tool === 'tick' || R.tool === 'cross' || R.tool === 'text' ? grabbable(i + 1, hp) : -1;
        c.classList.toggle('over', j >= 0);
        return;
      }
      if (active && active.pan && active.id === e.pointerId) {
        var bx = $('rv-pages');
        bx.scrollLeft = active.sl - (e.clientX - active.x); bx.scrollTop = active.st - (e.clientY - active.y);
        return;
      }
      if (!active || active.id !== e.pointerId || active.tap) return;
      e.preventDefault();
      var pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      if (!pts.length) pts = [e];
      pts.forEach(function (ev) { moveAction(i + 1, pagePoint(pg, ev)); });
    });
    var end = function (e) {
      if (!active || active.id !== e.pointerId) return;
      var a = active; active = null;
      if (a.pan) return;
      if (a.tap) {
        if (e.type === 'pointercancel') return;
        var pt = pagePoint(pg, e);
        if (Math.hypot(pt[0] - a.start[0], pt[1] - a.start[1]) > 6) return;
        startAction(i + 1, pt); endAction(i + 1);
        return;
      }
      endAction(i + 1);
    };
    c.addEventListener('pointerleave', function () { c.classList.remove('over'); });
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
  }

  /* A mark can be picked up and dragged: any mark with Move, a tick or cross with the tick and cross tools,
     typed text with Text (a tap on text edits it). The worksheet's own margin marks and total move with the marks
     panel, not by hand. */
  function grabbable(page, pt) {
    var j = hitObj(page, pt[0], pt[1], R.tool === 'move' ? 8 : 3);
    if (j < 0) return -1;
    var k = R.objects[j].k;
    if (R.tool === 'move') return j;
    if (R.tool === 'tick' || R.tool === 'cross') return k === 'tick' || k === 'cross' ? j : -1;
    if (R.tool === 'text') return k === 'text' ? j : -1;
    return -1;
  }
  function objGeom(o) { return o.k === 'ink' ? { p: o.p.map(function (q) { return q.slice(); }) } : { x: o.x, y: o.y }; }
  function placeObj(o, g, dx, dy, pg) {
    if (o.k === 'ink') { o.p = g.p.map(function (q) { return [q[0] + dx, q[1] + dy]; }); return; }
    o.x = Math.max(0, Math.min(pg ? pg.w : 1e9, g.x + dx)); o.y = Math.max(0, Math.min(pg ? pg.h : 1e9, g.y + dy));
  }
  function startAction(page, pt) {
    R.erasing = false; R.press = null;
    var j = grabbable(page, pt);
    if (j >= 0 || R.tool === 'move') {
      // Wait: a drag moves the mark, a tap places a new one (or edits the text) as before.
      R.press = { page: page, start: pt, j: j, drag: false, orig: j >= 0 ? objGeom(R.objects[j]) : null };
      return;
    }
    if (R.tool === 'tick' || R.tool === 'cross') {
      record();
      R.objects.push({ k: R.tool, page: page, x: Math.round(pt[0] * 10) / 10, y: Math.round(pt[1] * 10) / 10, by: 'teacher', c: R.color === MARK_RED ? undefined : R.color });
      redrawPage(page);
    } else if (R.tool === 'erase') {
      eraseAt(page, pt[0], pt[1]);
    } else if (R.tool === 'pen') {
      R.live = { k: 'ink', page: page, c: R.color, w: RV_SIZES[R.size].w, p: [[pt[0], pt[1]]], by: 'teacher' };
    } else if (R.tool === 'text') {
      askReviewText(page, pt);
    }
  }
  function moveAction(page, pt) {
    var pr = R.press;
    if (pr) {
      if (pr.j < 0) return;
      var dx = pt[0] - pr.start[0], dy = pt[1] - pr.start[1];
      if (!pr.drag) {
        if (Math.hypot(dx, dy) * R.zoom < 4) return;
        record(); pr.drag = true;
        var pc = R.pages[page - 1]; if (pc) pc.ink.classList.add('grabbing');
      }
      placeObj(R.objects[pr.j], pr.orig, dx, dy, R.pages[page - 1]);
      redrawPage(page);
      return;
    }
    if (R.tool === 'erase') { eraseAt(page, pt[0], pt[1]); return; }
    if (R.live) {
      var p = R.live.p, last = p[p.length - 1];
      if (Math.hypot(pt[0] - last[0], pt[1] - last[1]) < 0.6) return;
      p.push([Math.round(pt[0] * 100) / 100, Math.round(pt[1] * 100) / 100]);
      redrawPage(page);
    }
  }
  function endAction(page) {
    var pr = R.press;
    if (pr) {
      R.press = null;
      var pe = R.pages[page - 1]; if (pe) pe.ink.classList.remove('grabbing');
      if (pr.drag) {
        var o = R.objects[pr.j];
        if (o.k === 'ink') o.p = o.p.map(function (q) { return [Math.round(q[0] * 100) / 100, Math.round(q[1] * 100) / 100]; });
        else { o.x = Math.round(o.x * 10) / 10; o.y = Math.round(o.y * 10) / 10; }
        redrawPage(page); setDirty();
      } else if (R.tool === 'tick' || R.tool === 'cross') {
        record();
        R.objects.push({ k: R.tool, page: page, x: Math.round(pr.start[0] * 10) / 10, y: Math.round(pr.start[1] * 10) / 10, by: 'teacher', c: R.color === MARK_RED ? undefined : R.color });
        redrawPage(page);
      } else if (R.tool === 'text' && pr.j >= 0) {
        editReviewText(pr.j);
      } else if (R.tool === 'move' && pr.j < 0) {
        toast('Drag a tick, a cross, writing or text to move it.');
      }
      return;
    }
    if (R.live) {
      record();
      R.objects.push(R.live); R.live = null;
      redrawPage(page);
    }
    R.erasing = false;
  }

  function askReviewText(page, pt) {
    modal('<h2>Add text</h2><div class="field"><textarea id="rt-t" placeholder="Type what to write on the page"></textarea></div>' +
      '<div class="foot"><button class="btn ghost" id="rt-c">Cancel</button><button class="btn" id="rt-ok">Add</button></div>');
    setTimeout(function () { var f = $('rt-t'); if (f) f.focus(); }, 40);
    $('rt-c').onclick = closeModal;
    $('rt-ok').onclick = function () {
      var t = $('rt-t').value.replace(/\s+$/, '');
      closeModal();
      if (!t) return;
      record();
      var sz = RV_SIZES[R.size].pt;
      R.objects.push({ k: 'text', page: page, x: pt[0], y: pt[1] + sz * 0.8, t: t, sz: sz, c: R.color, by: 'teacher' });
      redrawPage(page);
    };
  }

  function editReviewText(j) {
    var o = R.objects[j];
    modal('<h2>Change text</h2><div class="field"><textarea id="rt-t"></textarea></div>' +
      '<div class="foot"><button class="btn ghost" id="rt-del">Delete</button><button class="btn ghost" id="rt-c">Cancel</button><button class="btn" id="rt-ok">Save</button></div>');
    $('rt-t').value = o.t;
    setTimeout(function () { var f = $('rt-t'); if (f) f.focus(); }, 40);
    $('rt-c').onclick = closeModal;
    $('rt-del').onclick = function () { closeModal(); record(); R.objects.splice(R.objects.indexOf(o), 1); redrawPage(o.page); };
    $('rt-ok').onclick = function () {
      var t = $('rt-t').value.replace(/\s+$/, '');
      closeModal();
      if (t === o.t) return;
      record();
      if (!t) R.objects.splice(R.objects.indexOf(o), 1); else o.t = t;
      redrawPage(o.page);
    };
  }

  function setRvTool(t) {
    R.tool = t;
    Array.prototype.forEach.call($('review').querySelectorAll('[data-tool]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-tool') === t)); });
    var box = $('rv-pages');
    box.className = 'rv-pages t-' + t + (R.finger ? ' finger' : '');
  }

  /* ----- marks panel ----- */

  function renderSolutionSide() {
    var d = R.data, w = byId(R.id) || (H.marks && H.marks.worksheet) || {}, j = w.job || {};
    var nc = R.objects.filter(function (o) { return o.by === 'claude'; }).length;
    var h = '<button class="btn quiet small rv-close-panel" id="rv-cpanel">Close &times;</button><div class="rv-sol">' +
      '<h4 style="margin-top:0">Your marked solution</h4>' +
      '<p>' + (d.checked ? 'You saved this on ' + esc(d.checked) + '. Claude marks against it.' : 'Claude has written the answers and the marks for each step on the worksheet.') + '</p>' +
      '<ul><li>Erase anything wrong with the eraser, then write or type it again.</li><li>Use the pen or Text to add answers, other accepted answers and marks.</li><li>Save. Claude marks against what you save. Students never see it.</li></ul>' +
      (j.checks && j.checks.length && j.status === 'solution_ready' ? '<h4>Claude asks you to check</h4><ul>' + j.checks.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' : '') +
      (nc ? '<p class="muted small">' + plural(nc, 'mark', 'marks') + ' by Claude. Hide them with Claude\'s marks to see the bare worksheet.</p>' : '') + '</div>';
    $('rv-side').innerHTML = h;
    $('rv-cpanel').onclick = function () { $('review').classList.remove('panel-open'); };
  }

  function saveSolution(then) {
    busy('Saving your marked solution...');
    buildReviewPdf().then(function (bytes) {
      return tcall('api_t_saveSolution', R.id, bytesB64(bytes), { v: 1, by: 'teacher', solution: true, objects: R.objects });
    }).then(function (res) {
      closeModal();
      R.data.checked = res.savedAt; R.dirty = false;
      toast('Marked solution saved. Claude marks against it.');
      if (then) then(); else drawReviewFrame();
    }).catch(function (e) {
      if (/TEACHER_SIGNED_OUT/.test(e.message)) return;
      alertBox('Not saved', msg(e) + ' Your changes are still here. Try again.');
    });
  }

  function renderSide() {
    if (R.solution) { renderSolutionSide(); return; }
    var d = R.data, h = '<button class="btn quiet small rv-close-panel" id="rv-cpanel">Close &times;</button>';
    if (d.released) h += '<p class="rv-warn">Students can already see this marking. Saving changes what they see.</p>';
    if (R.layout) {
      var t = totals();
      h += '<div class="rv-total"><b id="rv-tot">' + fmtN(t.got) + '/' + t.max + '</b><span>Total, added up from the questions</span></div>';
      R.layout.items.forEach(function (it) {
        var v = R.items[it.q];
        h += '<div class="rv-q" data-q="' + esc(it.q) + '"><div class="row"><span class="lab">' + esc(it.label || it.q) + '</span>' +
          '<button class="stp" data-d="-1" aria-label="One mark less for ' + esc(it.label || it.q) + '">&minus;</button>' +
          '<input class="got" inputmode="decimal" value="' + fmtN(v.got) + '" aria-label="Marks for ' + esc(it.label || it.q) + '">' +
          '<button class="stp" data-d="1" aria-label="One mark more for ' + esc(it.label || it.q) + '">+</button>' +
          '<span class="mx">/ ' + it.max + '</span></div>' +
          '<textarea class="note" placeholder="Feedback for this question (optional)" aria-label="Feedback for ' + esc(it.label || it.q) + '">' + esc(v.note) + '</textarea></div>';
      });
    } else {
      h += '<h4 style="margin-top:0">Score</h4><input class="score1" id="rv-score" value="' + esc(R.score) + '" placeholder="7/10" aria-label="Score">' +
        '<p class="rv-note">Claude has not marked this worksheet, so there is no question list. Type the score, for example 7/10.</p>';
    }

  /* ----- saving: the marked PDF, built here ----- */

  function rgbOf(hex) {
    var n = parseInt(String(hex).slice(1), 16);
    return PDFLib.rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
  }

  // Characters the standard PDF font cannot show are replaced, so a save never fails on a symbol.
  function pdfSafe(font, s) {
    var out = '';
    String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').split('').forEach(function (ch) {
      try { font.encodeText(ch); out += ch; } catch (e) { out += '?'; }
    });
    return out;
  }

  function wrapText(font, size, text, width) {
    var words = String(text || '').split(/\s+/).filter(Boolean), lines = [], cur = '';
    words.forEach(function (w) {
      var t = cur ? cur + ' ' + w : w;
      if (font.widthOfTextAtSize(t, size) <= width) cur = t;
      else { if (cur) lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  }

  function buildReviewPdf() {
    var L = PDFLib;
    return L.PDFDocument.load(R.bytes, { ignoreEncryption: true }).then(function (doc) {
      return Promise.all([doc.embedFont(L.StandardFonts.Helvetica), doc.embedFont(L.StandardFonts.HelveticaBold)]).then(function (f) {
        var font = f[0], bold = f[1];
        R.pages.forEach(function (pg, i) {
          var page = doc.getPage(i), conv = function (x, y) { return pg.vp.convertToPdfPoint(x, y); };
          var o0 = conv(0, 0), o1 = conv(1, 0), ang = Math.atan2(o1[1] - o0[1], o1[0] - o0[0]) * 180 / Math.PI;
          var ops = [];
          var addLines = function (lines, w, col) {
            var c = rgbOf(col);
            ops.push(L.pushGraphicsState(), L.setStrokingRgbColor(c.red, c.green, c.blue), L.setLineWidth(w),
              L.setLineCap(L.LineCapStyle.Round), L.setLineJoin(L.LineJoinStyle.Round));
            lines.forEach(function (ln) {
              var q = conv(ln[0], ln[1]); ops.push(L.moveTo(q[0], q[1]));
              for (var k = 2; k < ln.length; k += 2) { q = conv(ln[k], ln[k + 1]); ops.push(L.lineTo(q[0], q[1])); }
            });
            ops.push(L.stroke(), L.popGraphicsState());
          };
          var texts = [];
          derived(i + 1, pg).forEach(function (d) {
            if (d.lines) addLines(d.lines, d.w, MARK_RED);
            else texts.push({ t: d.text, x: d.x, cx: d.cx, y: d.y, size: d.size, font: bold, c: MARK_RED });
          });
          R.objects.forEach(function (o) {
            if (o.page !== i + 1) return;
            if (o.k === 'tick' || o.k === 'cross') addLines(objLines(o), MARK_W, o.c || MARK_RED);
            else if (o.k === 'ink') {
              var flat = []; o.p.forEach(function (p) { flat.push(p[0], p[1]); });
              if (o.p.length === 1) flat.push(o.p[0][0] + 0.01, o.p[0][1]);
              addLines([flat], o.w, o.c);
            } else if (o.k === 'text') {
              String(o.t).split('\n').forEach(function (line, j) { texts.push({ t: line, x: o.x, y: o.y + j * o.sz * 1.2, size: o.sz, font: font, c: o.c }); });
            }
          });
          if (ops.length) page.pushOperators.apply(page, ops);
          texts.forEach(function (t) {
            var s = pdfSafe(t.font, t.t), x = t.cx != null ? t.cx - t.font.widthOfTextAtSize(s, t.size) / 2 : t.x;
            var q = conv(x, t.y);
            page.drawText(s, { x: q[0], y: q[1], size: t.size, font: t.font, color: rgbOf(t.c), rotate: L.degrees(ang) });
          });
        });
        if (R.layout && R.feedback) feedbackPages(doc, font, bold);
        return doc.save();
      });
    });
  }

  // "Your marking": the same page Claude adds, one row per question with the mark and the feedback.
  function feedbackPages(doc, font, bold) {
    var L = PDFLib, RED = L.rgb(0.80, 0.11, 0.11), INK = L.rgb(0.11, 0.14, 0.2), GREY = L.rgb(0.36, 0.40, 0.47);
    var GREEN = L.rgb(0.12, 0.54, 0.3), PINKC = L.rgb(1, 0.95, 0.95), LINE = L.rgb(0.84, 0.87, 0.92), FAINT = L.rgb(0.93, 0.95, 0.97);
    var w = R.pages[0].w, h = R.pages[0].h;
    if (w > h) { var tmp = w; w = h; h = tmp; }
    var m = 56, page = doc.addPage([w, h]), y = h - 64, t = totals();
    var S = function (f, s) { return pdfSafe(f, s); };
    page.drawText('Your marking', { x: m, y: y, size: 18, font: bold, color: INK });
    page.drawText(S(font, (R.layout.worksheet || R.data.id + ' ' + R.data.title) + '   ' + R.data.cls + '   ' + R.data.name), { x: m, y: y - 18, size: 10.5, font: font, color: GREY });
    page.drawEllipse({ x: w - m - 46, y: y - 7, xScale: 46, yScale: 23, borderColor: RED, borderWidth: 2.2 });
    var tt = fmtN(t.got) + '/' + t.max;
    page.drawText(tt, { x: w - m - 46 - bold.widthOfTextAtSize(tt, 17) / 2, y: y - 13, size: 17, font: bold, color: RED });
    y -= 44;
    var anyMarks = R.objects.some(function (o) { return o.k === 'tick' || o.k === 'cross'; });
    if (anyMarks) {
      var base = y - 5;
      // tick and cross drawn as short lines, the same shapes as on the worksheet
      var drawLn = function (pts) { for (var k = 0; k + 3 < pts.length; k += 2) page.drawLine({ start: { x: pts[k], y: pts[k + 1] }, end: { x: pts[k + 2], y: pts[k + 3] }, thickness: 1.5, color: RED, lineCap: L.LineCapStyle.Round }); };
      var cyT = base + 3.2;
      drawLn([m + 6 - 6, cyT, m + 6 - 2, cyT - 4.5, m + 6 + 6, cyT + 6.5]);
      page.drawText('a point you made', { x: m + 18, y: base, size: 10, font: font, color: INK });
      var cyX = base + 3.5;
      drawLn([m + 142 - 4.2, cyX - 4.2, m + 142 + 4.2, cyX + 4.2]); drawLn([m + 142 - 4.2, cyX + 4.2, m + 142 + 4.2, cyX - 4.2]);
      page.drawText('this answer is wrong or incomplete', { x: m + 152, y: base, size: 10, font: font, color: INK });
      y -= 24;
    } else y -= 14;
    var cq = m, cm = m + 64, cf = m + 124, fw = w - m - cf;
    page.drawText('Question', { x: cq, y: y, size: 9.5, font: bold, color: GREY });
    page.drawText('Marks', { x: cm, y: y, size: 9.5, font: bold, color: GREY });
    page.drawText('Feedback', { x: cf, y: y, size: 9.5, font: bold, color: GREY });
    y -= 8; page.drawLine({ start: { x: m, y: y }, end: { x: w - m, y: y }, thickness: 0.8, color: LINE }); y -= 15;
    R.layout.items.forEach(function (it) {
      var v = R.items[it.q], lines = wrapText(font, 10.5, S(font, v.note || ''), fw), need = 15 * Math.max(1, lines.length) + 8;
      if (y - need < 90) { page = doc.addPage([w, h]); y = h - 64; }
      page.drawText(S(bold, it.label || it.q), { x: cq, y: y, size: 10.5, font: bold, color: INK });
      page.drawText(fmtN(v.got) + '/' + it.max, { x: cm, y: y, size: 10.5, font: bold, color: v.got < it.max ? RED : GREEN });
      lines.forEach(function (ln, k) { page.drawText(ln, { x: cf, y: y - 15 * k, size: 10.5, font: font, color: INK }); });
      y -= need;
      page.drawLine({ start: { x: m, y: y + 10 }, end: { x: w - m, y: y + 10 }, thickness: 0.8, color: FAINT });
    });
    if (R.comment.trim()) {
      var cl = wrapText(font, 11, S(font, R.comment.trim()), w - 2 * m - 24), bh = 30 + 15 * cl.length;
      if (y - bh < 60) { page = doc.addPage([w, h]); y = h - 64; }
      y -= 6;
      page.drawRectangle({ x: m, y: y - bh, width: w - 2 * m, height: bh, color: PINKC });
      page.drawRectangle({ x: m, y: y - bh, width: 3, height: bh, color: RED });
      page.drawText("Teacher's comment", { x: m + 14, y: y - 17, size: 10, font: bold, color: RED });
      cl.forEach(function (ln, k) { page.drawText(ln, { x: m + 14, y: y - 33 - 15 * k, size: 11, font: font, color: INK }); });
    }
  }

  /* ---------------- one-file return ---------------- */

  function parseCsv(text) {
    text = String(text).replace(/^﻿/, '');
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
    var col = function (re) { for (var j = 0; j < head.length; j++) if (re.test(head[j])) return j; return -1; };
    var cF = col(/file/), cC = col(/^class/), cN = col(/name/), cS = col(/score|mark/), cM = col(/comment|feedback/);
    if (cS < 0 && cM < 0) return [];
    return rows.slice(1).map(function (r) {
      var g = function (j) { return j >= 0 && j < r.length ? String(r[j]).trim() : ''; };
      return { file: g(cF), cls: g(cC), name: g(cN), score: g(cS), comment: g(cM) };
    }).filter(function (r) { return r.file || r.name; });
  }

  function isReport(name) { return /class[\s_-]*report/i.test(name.split('/').pop()); }
  function isAnswerKey(name) { return /answer[\s_-]*(key|scheme)|answers[\s_-]*explained/i.test(name.split('/').pop()); }
  function sortPdf(out, item) { if (isReport(item.name)) out.report = item; else if (isAnswerKey(item.name)) out.answers = item; else out.pdfs.push(item); }
  function skipEntry(name) { var b = name.split('/').pop(); return !b || b[0] === '.' || /(^|\/)__MACOSX\//.test(name); }

  // Reads what the teacher chose: one return zip, or loose PDFs and a scores.csv.
  function readReturn(files) {
    var out = { pdfs: [], report: null, answers: null, scores: null, other: [] };
    var jobs = Array.prototype.map.call(files, function (f) {
      if (/\.zip$/i.test(f.name)) {
        return loadZipLib().then(function () { return JSZip.loadAsync(f); }).then(function (z) {
          var inner = [];
          z.forEach(function (path, entry) {
            if (entry.dir || skipEntry(path)) return;
            if (/\.pdf$/i.test(path)) inner.push(entry.async('blob').then(function (b) {
              sortPdf(out, { name: path.split('/').pop(), blob: b });
            }));
            else if (/\.csv$/i.test(path)) inner.push(entry.async('string').then(function (t) { var rows = parseCsv(t); if (rows.length) out.scores = rows; }));
            else out.other.push(path.split('/').pop());
          });
          return Promise.all(inner);
        });

  function uploadReturn(w, got, big, autoRelease) {

    $('rt-foot').innerHTML = '';

      if (!total) { resolve(); return; }
      function next() {
        if (!queue.length) { if (!running) resolve(); return; }

    }).then(function () {
      if (!got.scores) return null;

        (scoreRes ? '<li><b>' + sOk + '</b> score' + (sOk === 1 ? '' : 's') + ' and comments saved</li>' : '') +
        (results.some(function (x) { return x.r.report; }) ? '<li><b>1</b> class report saved</li>' : '') +

          sBad.map(function (x) { return '<li>' + esc(x.who) + ': ' + esc(x.reason) + '</li>'; }).join('') + '</ul></div>';
      }

      $('rt-body').innerHTML = h;

  // On-time rate for the worksheets due between two times (ms), from the tracker columns.
  function rateBetween(c, from, to) {

    return due ? on / due : null;
  }
  function trackerStats(c) {

    var weeks = {};
    c.worksheets.forEach(function (w, j) {
      if (!w.isDue || !w.dueTs || !c.rows.length) return;
      var d = new Date(w.dueTs), mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)), k = mon.getTime();
      var x = weeks[k] = weeks[k] || { due: 0, on: 0, t: k }; x.due += c.rows.length; x.on += c.onTime[j];
    });
    var best = null; Object.keys(weeks).forEach(function (k) { var x = weeks[k]; x.rate = x.on / x.due; if (!best || x.rate > best.rate || (x.rate === best.rate && x.t > best.t)) best = x; });
    return { last: last, before: before, best: best };

  // The class on-time rate for each due worksheet, in date order, as a small line chart.

    var pts = [];

    pts.sort(function (a, b) { return a.t - b.t; });

    var X = function (i) { return L + (pts.length === 1 ? iw / 2 : iw * i / (pts.length - 1)); }, Y = function (r) { return T + ih * (1 - r); };
    var grid = [0, 0.5, 1].map(function (g) { return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '" class="tg"/><text x="' + (L - 6) + '" y="' + (Y(g) + 4).toFixed(1) + '" text-anchor="end" class="tl">' + (100 * g) + '%</text>'; }).join('');
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.r).toFixed(1); }).join(' ');
    var area = line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + Y(0).toFixed(1) + ' L' + X(0).toFixed(1) + ' ' + Y(0).toFixed(1) + ' Z';
    var dots = pts.map(function (p, i) {
      var lab = new Date(p.t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.r).toFixed(1) + '" r="4.5" class="td"><title>' + esc(p.w.title) + ', due ' + esc(lab) + ': ' + pctText(p.r) + ' on time</title></circle>' +
        (i === 0 || i === pts.length - 1 || pts.length <= 6 ? '<text x="' + X(i).toFixed(1) + '" y="' + (Hh - 6) + '" text-anchor="middle" class="tl">' + esc(lab) + '</text>' : '');
    }).join('');
    return '<svg class="trend" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="On-time rate for each worksheet, from ' + pctText(pts[0].r) + ' to ' + pctText(pts[pts.length - 1].r) + '">' +
      grid + '<path d="' + area + '" class="ta"/><path d="' + line + '" class="tp"/>' + dots + '</svg>';

  // Points earned and spent by the class, week by week.
  function pointsChart(weeks) {
    var w = (weeks || []).slice(-10);
    if (w.length < 2) return '';
    var W = 520, Hh = 150, L = 38, R = 8, T = 10, B = 28, iw = W - L - R, ih = Hh - T - B;
    var top = Math.max.apply(null, w.map(function (x) { return Math.max(x.earned, x.spent); }).concat([10]));
    var step = Math.pow(10, Math.floor(Math.log10(top))); var nice = Math.ceil(top / step) * step; if (nice / step > 5 && step > 1) nice = Math.ceil(top / (step * 2)) * step * 2;
    var bw = iw / w.length, gap = Math.min(6, bw * 0.15), bar = (bw - gap * 3) / 2;
    var Y = function (v) { return T + ih * (1 - v / nice); };
    var grid = [0, 0.5, 1].map(function (g) { var v = Math.round(nice * g); return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" class="tg"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" class="tl">' + v + '</text>'; }).join('');
    var bars = w.map(function (x, i) {

      return '<rect x="' + x0.toFixed(1) + '" y="' + Y(x.earned).toFixed(1) + '" width="' + bar.toFixed(1) + '" height="' + (Y(0) - Y(x.earned)).toFixed(1) + '" rx="3" class="be"><title>Week of ' + lab + ': ' + x.earned + ' earned</title></rect>' +
        '<rect x="' + (x0 + bar + gap).toFixed(1) + '" y="' + Y(x.spent).toFixed(1) + '" width="' + bar.toFixed(1) + '" height="' + (Y(0) - Y(x.spent)).toFixed(1) + '" rx="3" class="bs"><title>Week of ' + lab + ': ' + x.spent + ' spent</title></rect>' +
        (i % Math.ceil(w.length / 6) === 0 || i === w.length - 1 ? '<text x="' + (x0 + bar + gap / 2).toFixed(1) + '" y="' + (Hh - 8) + '" text-anchor="middle" class="tl">' + lab + '</text>' : '');
    }).join('');

        '<div class="field"><label for="hx-formula">Formula card</label><div class="symrow">' + FSYMS.map(function (c) { return '<button type="button" data-sym="' + c + '">' + c + '</button>'; }).join('') + '</div>' +
