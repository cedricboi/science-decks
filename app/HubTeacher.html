        '<div class="field"><label>Hints</label><p class="muted small" style="margin:0 0 6px">One hint per question. Students see the question numbers and open a hint only when they choose to.</p><div id="hx-hints">' + x.hints.map(hintRow).join('') + '</div>' +
          '<button type="button" class="btn quiet small" id="hx-add">' + ICON.plus + 'Add a hint</button>' +
          '<div class="stepper" style="margin-top:8px"><label for="hx-cost">A hint costs</label><div class="sp"><button type="button" class="spb" data-hc="-5" aria-label="Less">−</button><input type="number" id="hx-cost" min="0" max="100" value="' + x.hintCost + '"><button type="button" class="spb" data-hc="5" aria-label="More">+</button></div><span class="u">points (0 is free)</span></div></div>' +
        '<div class="field"><label>Notes or slides beside the worksheet</label><div class="row">' + (x.notes && !dropNotes ? '<span class="chip">' + esc(x.notesName || 'Notes') + '</span><button type="button" class="btn quiet small" id="hx-nodrop">Remove</button>' : '<span class="muted small">' + (notesFile ? esc(notesFile.name) + ' (saved when you tap Save)' : 'None') + '</span>') +
          '<label class="btn ghost small keyfile">' + ICON.up + (x.notes ? 'Replace' : 'Upload a PDF') + '<input type="file" id="hx-notes" accept=".pdf,application/pdf"></label></div><p class="muted small" style="margin:4px 0 0">Save slides from PowerPoint or Google Slides as a PDF first.</p></div>' +
        '<div class="field"><label>Tools</label><div class="switches tools">' + TOOL_NAMES.map(function (t) {
          var dis = t[0] === 'nudge' && !x.nudge.on;
          return sw('hx-t-' + t[0], !!x.tools[t[0]] && !dis, dis, t[1], t[0] === 'nudge' ? (x.nudge.on ? 'Claude gives a hint, never the answer. Students get 6 a day.' : 'Turn on Ask Claude in the menu (T) first.') : t[0] === 'graph' ? 'Turn off if the graph itself is what you are testing.' : t[0] === 'calc' ? 'Turn off for a mental-sums worksheet.' : '');
        }).join('') + '</div></div>' +
        '<div class="err" id="hx-err"></div><div class="foot"><button class="btn ghost" id="hx-x">Cancel</button><button class="btn" id="hx-go">Save</button></div>', 'wide');
      var ta = $('hx-formula');
      Array.prototype.forEach.call(document.querySelectorAll('[data-sym]'), function (b) { b.onclick = function () { var c = b.getAttribute('data-sym'), a = ta.selectionStart, z = ta.selectionEnd; ta.value = ta.value.slice(0, a) + c + ta.value.slice(z); ta.focus(); ta.selectionStart = ta.selectionEnd = a + c.length; }; });
      var keep = function () {
        x.formula = ta.value;
        x.hints = Array.prototype.map.call(document.querySelectorAll('#hx-hints .hrow'), function (r) { var old = x.hints[Number(r.getAttribute('data-hi'))] || {}; return { id: old.id || '', q: r.querySelector('.hq').value, text: r.querySelector('.ht').value }; });
        x.hintCost = Number($('hx-cost').value) || 0;
        TOOL_NAMES.forEach(function (t) { var c = $('hx-t-' + t[0]); if (c && !c.disabled) x.tools[t[0]] = c.checked; });
      };
      $('hx-add').onclick = function () { keep(); x.hints.push({ id: '', q: 'Q' + (x.hints.length + 1), text: '' }); draw(); var r = document.querySelectorAll('#hx-hints .ht'); r[r.length - 1].focus(); };
      Array.prototype.forEach.call(document.querySelectorAll('[data-hx]'), function (b) { b.onclick = function () { keep(); x.hints.splice(Number(b.getAttribute('data-hx')), 1); draw(); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-hc]'), function (b) { b.onclick = function () { var i = $('hx-cost'); i.value = Math.max(0, Math.min(100, (Number(i.value) || 0) + Number(b.getAttribute('data-hc')))); }; });
      if ($('hx-nodrop')) $('hx-nodrop').onclick = function () { keep(); dropNotes = true; x.notes = ''; draw(); };
      $('hx-notes').onchange = function () { keep(); notesFile = this.files[0] || null; dropNotes = false; draw(); };
      $('hx-x').onclick = closeModal;
      $('hx-go').onclick = function () {
        keep();
        busy('Saving...');
        tcall('api_t_setExtras', w.id, { formula: x.formula, hints: x.hints, hintCost: x.hintCost, tools: x.tools }).then(function (r) {
          if (notesFile) return fileToB64(notesFile).then(function (b64) { return tcall('api_t_wsNotes', w.id, b64, notesFile.name); });
          if (dropNotes) return tcall('api_t_wsNotes', w.id, '', '');
          return r;
        }).then(function (r) { H.extras[w.id] = r; closeModal(); toast('Saved'); var el = $('d-helpers'); if (el) { el.innerHTML = helpersHtml(w, r); $('d-helpers-edit').onclick = function () { helpersBox(w); }; } })
          .catch(function (e) { if (!/TEACHER_SIGNED_OUT/.test(e.message)) alertBox('Not saved', msg(e), function () { draw(); }); });
      };
    };
    draw();
  }
  var CONF_COL = ['#C23B35', '#E0A100', '#1C7A4C'];
  function helpHtml(hp) {
    var h = '<div class="row"><h3 style="margin:0">Stuck and how sure</h3><span class="spacer"></span><button class="btn quiet small" id="d-help-r">' + ICON.refresh + 'Refresh</button></div>' +
      '<p class="muted small">Students flag a question they are stuck on and say how sure they are, from the toolkit while they work.</p>';
    h += '<h4 class="hh">Stuck now</h4>' + (hp.stuck.length ? '<div class="stuckq">' + hp.stuck.map(function (s) {
      return '<div class="sq"><b>' + esc(s.q) + '</b><span class="n">' + plural(s.n, 'student', 'students') + '</span><div class="chips">' + s.names.map(function (x) { return '<span class="chip" title="' + esc(x.cls + ', ' + x.when + (x.page ? ', page ' + x.page : '')) + '">' + esc(x.name) + '</span>'; }).join('') + '</div></div>';
    }).join('') + '</div>' : '<p class="muted small" style="margin:0">No one is stuck right now.</p>');
    if (hp.conf.length) {
      h += '<h4 class="hh">How sure they feel</h4><div class="heat" role="table" aria-label="How sure students feel, question by question">' +
        '<div class="heat-key" aria-hidden="true">' + ['Not sure', 'Getting there', 'Got it'].map(function (t, k) { return '<span><i style="background:' + CONF_COL[k] + '"></i>' + t + '</span>'; }).join('') + '</div>' +
        hp.conf.map(function (c) {
          var tot = c.counts[0] + c.counts[1] + c.counts[2];
          return '<div class="hrow2" role="row"><b role="rowheader">' + esc(c.q) + '</b><div class="hbar" role="cell">' + c.counts.map(function (n, k) {
            return n ? '<i style="width:' + (100 * n / tot).toFixed(1) + '%;background:' + CONF_COL[k] + ';color:' + (k === 1 ? '#2B2200' : '#fff') + '" title="' + esc(['Not sure', 'Getting there', 'Got it'][k] + ': ' + c.names[k].join(', ')) + '">' + n + '</i>' : '';
          }).join('') + '</div><span class="hn" role="cell">' + tot + '</span></div>';
        }).join('') + '</div>';
    }
    var used = hp.hints.filter(function (x) { return x.n; });
    if (hp.hints.length) h += '<h4 class="hh">Hints</h4><ul class="hintuse">' + hp.hints.map(function (x) { return '<li><b>' + esc(x.q || 'Hint') + '</b> ' + (x.n ? 'opened by ' + plural(x.n, 'student', 'students') + ' <span class="muted">(' + esc(x.names.join(', ')) + ')</span>' : '<span class="muted">not opened yet</span>') + '</li>'; }).join('') + '</ul>' + (used.length && hp.hintCost ? '<p class="muted small">Each hint cost ' + hp.hintCost + ' points.</p>' : '');
    if (hp.nudges.length) h += '<details class="nudges"><summary>What Claude said (' + hp.nudges.length + ')</summary><ul>' + hp.nudges.map(function (n) { return '<li><b>' + esc(n.name) + '</b>, ' + esc(n.q || 'a question') + ' <span class="muted">' + esc(n.when) + '</span><p>' + esc(n.text) + '</p></li>'; }).join('') + '</ul></details>';
    return h;
  }
  // Ask Claude for students: the school's own API key, kept in the script, and one switch.
  function nudgeSettings() {
    busy('Checking...');
    tcall('api_t_nudge').then(function (n) {
      modal('<h2>Ask Claude for a nudge (students)</h2>' +
        '<p>When this is on, students can drag a box around a question they are stuck on and Claude replies with one guiding question or reminder. It is told never to give the answer. Students get 6 nudges per worksheet a day, and you can read every nudge on the worksheet page.</p>' +
        '<div class="problems" style="background:var(--hl);border-color:var(--hl-line);color:var(--ink)"><b>Check first.</b> Only the picture of that part of the page goes to Anthropic, never the student\'s name. Follow your school\'s rules on AI tools and student data, and ask your school before turning this on. It is off until you turn it on, and you can also turn it off for each worksheet.</div>' +
        '<div class="field"><label for="nd-key">Claude API key</label><input type="password" id="nd-key" autocomplete="off" placeholder="' + (n.hasKey ? 'Saved (ends ' + esc(n.ends) + '). Paste a new key to change it.' : 'sk-ant-...') + '"><p class="muted small" style="margin:4px 0 0">From console.anthropic.com, API keys. It is kept in the script, not in the Sheet.</p></div>' +
        sw('nd-on', n.on, false, 'Students can ask Claude', 'Turn off at any time.') +
        '<div class="err" id="nd-err"></div><div class="foot">' + (n.hasKey ? '<button class="btn quiet" id="nd-del">Remove the key</button><span class="spacer"></span>' : '') + '<button class="btn ghost" id="nd-x">Close</button><button class="btn" id="nd-go">Save</button></div>', 'wide');
      $('nd-x').onclick = closeModal;
      if ($('nd-del')) $('nd-del').onclick = function () { busy('Removing...'); tcall('api_t_setNudge', { key: '' }).then(function () { closeModal(); toast('Key removed. Ask Claude is off.'); }).catch(function (e) { alertBox('Not changed', msg(e)); }); };
      $('nd-go').onclick = function () {
        var patch = { on: $('nd-on').checked }, k = $('nd-key').value.trim();
        if (k) patch.key = k;
        $('nd-err').textContent = '';
        tcall('api_t_setNudge', patch).then(function (r) { closeModal(); toast(r.on ? 'Ask Claude is on' : 'Ask Claude is off'); })
          .catch(function (e) { $('nd-err').textContent = msg(e); });
      };
    }).catch(function (e) { if (!/TEACHER_SIGNED_OUT/.test(e.message)) alertBox('Could not open', msg(e)); });
  }
  // A class goal: points everyone in the class earns count towards it.
  function goalBox(cls) {
    var g = (H.rw.goals || []).filter(function (x) { return x.cls === cls; })[0];
    modal('<h2>Class goal for ' + esc(cls) + '</h2><p class="muted">Every point the class earns from now on counts: homework, puzzles, quests and your bonuses. Spending does not take it away. Students see the bar on their homework page.</p>' +
      '<div class="field"><label for="gl-text">The reward</label><input type="text" id="gl-text" maxlength="60" value="' + esc(g ? g.text : '') + '" placeholder="A lesson outdoors"></div>' +
      '<div class="stepper"><label for="gl-target">Points needed</label><div class="sp"><button type="button" class="spb" data-gd="-500" aria-label="Less">−</button><input type="number" id="gl-target" min="50" step="50" value="' + (g ? g.target : 3000) + '"><button type="button" class="spb" data-gd="500" aria-label="More">+</button></div><span class="u">points</span></div>' +
      (g ? '<label class="switch" style="margin-top:10px"><input type="checkbox" id="gl-restart"><span class="track"></span><span>Start again from 0 (it is at ' + g.have + ' now)</span></label>' : '') +
      '<div class="err" id="gl-err"></div><div class="foot">' + (g ? '<button class="btn quiet" id="gl-del">Remove the goal</button><span class="spacer"></span>' : '') + '<button class="btn ghost" id="gl-x">Cancel</button><button class="btn" id="gl-go">' + (g ? 'Save' : 'Set the goal') + '</button></div>', 'wide');
    Array.prototype.forEach.call(document.querySelectorAll('[data-gd]'), function (b) { b.onclick = function () { var i = $('gl-target'); i.value = Math.max(50, (Number(i.value) || 0) + Number(b.getAttribute('data-gd'))); }; });
    $('gl-x').onclick = closeModal;
    if ($('gl-del')) $('gl-del').onclick = function () { busy('Removing...'); tcall('api_t_rwGoal', cls, null).then(function () { closeModal(); toast('Goal removed'); return loadRewards(); }).catch(rwErr); };
    $('gl-go').onclick = function () {
      var t = $('gl-text').value.trim();
      if (!t) { $('gl-err').textContent = 'Write what the class is working towards.'; return; }
      tcall('api_t_rwGoal', cls, { text: t, target: Number($('gl-target').value), restart: $('gl-restart') ? $('gl-restart').checked : false })
        .then(function () { closeModal(); toast('Goal saved'); return loadRewards(); }).catch(function (e) { $('gl-err').textContent = msg(e); });
    };
  }
  function isoLocal(ms) { var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

  function bindRewards() {
    $('rw-open').onchange = function () {
      var v = this.checked;
      tcall('api_t_rwMarket', { open: v, note: $('rw-note').value }).then(function () { toast(v ? 'Night market open' : 'Night market closed'); return loadRewards(); })
        .catch(function (e) { if (!/TEACHER_SIGNED_OUT/.test(e.message)) alertBox('Not changed', msg(e)); });
    };
    $('rw-savenote').onclick = function () { tcall('api_t_rwMarket', { note: $('rw-note').value }).then(function () { toast('Sign saved'); H.rw.market.note = $('rw-note').value; }).catch(rwErr); };
    $('rw-saveat').onclick = function () {
      var v = $('rw-at').value;
      if (!v) { alertBox('Choose a time', 'Choose the day and time the night market opens.'); return; }
      tcall('api_t_rwMarket', { opensAt: v.replace('T', ' ') }).then(function () { toast('Countdown started'); return loadRewards(); }).catch(rwErr);
    };
    if ($('rw-clearat')) $('rw-clearat').onclick = function () { tcall('api_t_rwMarket', { opensAt: '' }).then(function () { toast('Countdown stopped'); return loadRewards(); }).catch(rwErr); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal]'), function (b) { b.onclick = function () { goalBox(b.getAttribute('data-goal')); }; });
    $('rw-preview').onclick = studentPreview;
    $('rw-addp').onclick = function () { prizeBox(null); };
    Array.prototype.forEach.call(document.querySelectorAll('#rw-prizes [data-p]'), function (b) { b.onclick = function () { prizeBox(Number(b.getAttribute('data-p'))); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-hand],[data-undo]'), function (b) {
      b.onclick = function () {
        var hand = b.hasAttribute('data-hand');
        b.disabled = true;
        var row = Number(b.getAttribute(hand ? 'data-hand' : 'data-undo'));
        tcall('api_t_rwCollected', row, hand).then(function () {
          toast(hand ? 'Handed over' : 'Moved back to waiting', hand ? { undo: function () {
            tcall('api_t_rwCollected', row, false).then(function () { toast('Moved back to waiting'); return loadRewards(); }).catch(function (e) { if (!/TEACHER_SIGNED_OUT/.test(e.message)) alertBox('Not changed', msg(e)); });
          } } : null);
          return loadRewards();
        })
          .catch(function (e) { b.disabled = false; if (!/TEACHER_SIGNED_OUT/.test(e.message)) alertBox('Not changed', msg(e)); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rwcls]'), function (b) { b.onclick = function () { H.rwCls = b.getAttribute('data-rwcls'); if (H.cls) setClass(H.rwCls); else renderRewards(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-give]'), function (b) { b.onclick = function (e) { e.stopPropagation(); givePop(b); }; });
    // steppers and the worked example
    var ex = function () { $('ru-ex').textContent = ruleExample(ruleVals()); };
    Array.prototype.forEach.call(document.querySelectorAll('#view-rw [data-step]'), function (b) {
      b.onclick = function () { var i = $('ru-' + b.getAttribute('data-step')), d = Number(b.getAttribute('data-d')); i.value = Math.max(0, Math.round(((Number(i.value) || 0) + d) * 100) / 100); ex(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('#view-rw [data-rule]'), function (i) { i.addEventListener('input', ex); });
    $('rw-bonus').onclick = bonusBox;
    $('rw-saver').onclick = function () {
      var patch = {};
      ['onTime', 'late', 'topPct', 'top', 'midPct', 'mid', 'lowPct', 'low', 'blank', 'perToken', 'priceScale', 'daily', 'dailyFun', 'questOnTime', 'questQuiz'].forEach(function (k) { if ($('ru-' + k)) patch[k] = $('ru-' + k).value; });
      patch.from = $('ru-from').value;
      patch.board = $('ru-board').value;
      busy('Saving the rules...');
      tcall('api_t_rwRules', patch).then(function () { closeModal(); toast('Rules saved'); return loadRewards(); }).catch(rwErr);
    };
  }

  window.__hub = H; window.__parseCsv = parseCsv;   // for testing only
  boot();
})();
</script>
</body>
