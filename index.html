<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson decks</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#FDFBF7;color:#33404F;
   min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
 .card{max-width:640px;width:100%}
 h1{font-size:1.9rem;color:#C0392B;margin-bottom:4px}
 p.sub{color:#6b7686;margin-bottom:20px}

 /* subject tabs */
 .tabs{display:flex;gap:8px;border-bottom:2px solid #E4DED4;margin-bottom:20px}
 .tab{font:inherit;font-weight:700;font-size:.95rem;color:#6b7686;background:none;border:0;
   border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;cursor:pointer;
   border-radius:8px 8px 0 0;transition:color .15s,border-color .15s}
 .tab:hover{color:#33404F}
 .tab:focus-visible{outline:3px solid #33404F;outline-offset:2px}
 .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
 .panel[hidden]{display:none}

 /* each subject's colour comes from lessons.json */

 a.deck{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
   background:#fff;border:2px solid #E4DED4;border-radius:14px;padding:16px 18px;margin-bottom:12px;
   transition:border-color .15s,transform .15s}
 a.deck:hover{border-color:var(--accent);transform:translateY(-2px)}
 a.deck:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
 .num{background:var(--accent);color:#fff;font-weight:800;border-radius:10px;
   width:46px;height:46px;display:grid;place-items:center;font-size:1rem;flex:0 0 auto}
 .num.sm{font-size:.8rem}
 .t{font-weight:700}
 .d{font-size:.86rem;color:#6b7686}
 h2.ch{font-size:1.02rem;color:#33404F;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid #E4DED4}
 .panel > h2.ch:first-child{margin-top:0}
 .note{margin-top:22px;font-size:.84rem;color:#8a94a3;line-height:1.5}
 @media (prefers-reduced-motion:reduce){*{transition:none!important}}
 .msg{background:#fff;border:2px solid #E4DED4;border-radius:14px;padding:16px 18px;color:#6b7686}
</style></head>
<body><div class="card">
  <h1>Lesson decks</h1>
  <p class="sub">Choose a subject, then click a lesson to open it full screen</p>

  <div class="tabs" role="tablist" aria-label="Subject" id="tabs"></div>
  <div id="panels"><p class="msg" id="loading">Loading the lessons…</p></div>

  <!-- This page builds itself from lessons.json. To add or update a lesson, use Add or update a lesson
       in Live Board (Lessons tab), or ask Claude. Nothing here needs editing by hand. -->
  <p class="note">Opens in a new tab so the slides run full size.
     Put your name and class in the bar at the top before submitting an answer.</p>
</div>

<script>
(function(){
  var tabsBox = document.getElementById("tabs"), panelsBox = document.getElementById("panels");
  var SUBJECTS = [], tabs = [], panels = [];
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function build(cat){
    panelsBox.innerHTML = "";
    (cat.subjects || []).forEach(function(s, n){
      SUBJECTS.push(s.id);
      var t = el("button", "tab", s.name);
      t.id = "tab-" + s.id; t.setAttribute("role", "tab"); t.setAttribute("aria-controls", "panel-" + s.id);
      tabsBox.appendChild(t); tabs.push(t);
      var p = el("div", "panel");
      p.id = "panel-" + s.id; p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "tab-" + s.id); p.tabIndex = 0;
      p.style.setProperty("--accent", s.color || "#C0392B");
      (s.groups || []).forEach(function(g){
        if (!g.items || !g.items.length) return;
        p.appendChild(el("h2", "ch", g.name));
        g.items.forEach(function(it){
          var a = el("a", "deck"); a.href = it.file; a.target = "_blank"; a.rel = "noopener";
          a.appendChild(el("span", "num" + (it.small || it.kind === "tool" || String(it.num).length > 4 ? " sm" : ""), it.kind === "tool" ? "\u2605" : it.num));
          var w = el("span"); w.appendChild(el("span", "t", it.title)); w.appendChild(document.createElement("br"));
          w.appendChild(el("span", "d", it.note || (it.kind === "tool" ? "Revise and practise on your own" : "Slides, interactives, and questions to submit")));
          a.appendChild(w); p.appendChild(a);
        });
      });
      panelsBox.appendChild(p); panels.push(p);
      t.addEventListener("click", function(){
        try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
        show(s.id);
      });
      t.addEventListener("keydown", function(e){
        var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        var next = (n + d + SUBJECTS.length) % SUBJECTS.length;
        try { history.replaceState(null, "", "#" + SUBJECTS[next]); } catch (e2) {}
        show(SUBJECTS[next], true);
      });
    });
    show(location.hash.slice(1));
  }
  function show(name, focusTab){
    var i = SUBJECTS.indexOf(name);
    if (i < 0) i = 0;
    tabs.forEach(function(t, n){
      var on = (n === i);
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      t.style.setProperty("--accent", panels[n].style.getPropertyValue("--accent"));
      panels[n].hidden = !on;
    });
    tabsBox.style.setProperty("--accent", panels[i] ? panels[i].style.getPropertyValue("--accent") : "#C0392B");
    if (focusTab && tabs[i]) tabs[i].focus();
  }
  window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });
  fetch("lessons.json?t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(build)
    .catch(function(){ document.getElementById("loading").textContent = "The list of lessons did not load. Check the connection and refresh the page."; });
})();
</script>
</body></html>
